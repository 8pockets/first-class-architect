    - kind: professional_body
      title: 日本溶接協会 溶接管理技術者2級電子化教材
      locator: 冊子P177（電子版179/332）、3.7.2〔1〕建築鉄骨の完全溶込みを突合せと呼ぶ用語対応
      url: https://www-it.jwes.or.jp/we2/pageindices/index179.html
