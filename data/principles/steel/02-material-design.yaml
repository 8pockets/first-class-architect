    - 159
    - 177
    - 182
    question_codes:
    - '03163'
    - '05162'
    - '07161'
    - '19153'
    - '20183'
    - '26164'
    - '28154'
    - '30152'
    authoritative_sources:
    - kind: law
      title: 建築基準法施行令（e-Gov現行本文、2026-10-06照合）
      locator: 第92条・第98条の突合せ以外欄
      url: https://laws.e-gov.go.jp/law/325CO0000000338
      supports:
      - statement
      - conditions
  prerequisites:
  - S-K6-STEEL-F-VALUE-DEFINITION
  related:
  - S-K6-FILLET-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_checked
  question:
    prompt: 同じ基準強度Fのすみ肉溶接と完全溶込み溶接について、長期許容せん断応力度を比較したとき、正しい結論はどちらか。
    choices:
      A: いずれの形式もF/(1.5√3)で等しい
      B: すみ肉溶接だけF/1.5となる
    correct: A
  display_content:
    rule: 施行令第92条の突合せ以外の溶接（すみ肉溶接等）は、のど断面の長期許容応力度をF/(1.5√3)、短期をF/√3とする。材料強度は第98条により定め、材料強度用Fと許容応力度用Fを混同しない。
    applicability:
    - すみ肉溶接等の有効のど断面
    - 許容応力度の比較には同じ溶接部基準強度Fを用いる
    - 部分溶込み溶接の使用可否は別に確認する
