version: 1
section:
  id: K6-02
  title: 鋼材の特徴と設計上の注意
  order: 3
principles:
- id: S-K6-STEEL-ALLOWABLE-STRESS-DURATION
  order: 1
  type: rule
  display_content:
    rule: 長期の圧縮・引張・曲げ許容応力度はF/1.5、長期せん断はF/(1.5√3)、短期の圧縮・引張・曲げはF、短期せん断はF/√3とする。
    applicability:
    - 構造用鋼材
    - 座屈による低減を別途要しない応力度
    - 長期荷重
    - 鋼材母材
    numbers_exceptions:
    - 長期の圧縮・引張・曲げ許容応力度はF/1.5、長期せん断はF/(1.5√3)、短期の圧縮・引張・曲げはF、短期せん断はF/√3とする。
  principle: 構造用鋼材の長期・短期許容応力度
  question:
    prompt: 座屈による低減を別途要しない構造用鋼材で、長期と短期の許容応力度の関係について、正しい結論はどちらか。
    choices:
      A: 長期許容応力度は短期許容応力度の1.5倍とする
      B: 短期許容応力度は長期許容応力度の1.5倍とする
    correct: B
  conclusion: 長期の圧縮・引張・曲げ許容応力度はF/1.5、長期せん断はF/(1.5√3)、短期の圧縮・引張・曲げはF、短期せん断はF/√3とする。
  reason: 短期許容応力度を長期許容応力度の1.5倍とするため。
  conditions:
  - 構造用鋼材
  - 座屈による低減を別途要しない応力度
  - 長期荷重
  - 鋼材母材
  source:
    pages:
    - 159
    - 177
    - 182
    question_codes:
    - '19165'
    - '23303'
    authoritative_sources:
    - kind: law
      title: 建築基準法施行令（e-Gov現行本文、2026-10-06照合）
      locator: 第90条第1項表一・第2項
      url: https://laws.e-gov.go.jp/law/325CO0000000338
      supports:
      - statement
      - conditions
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-STEEL-MATERIAL-STRENGTH-JIS-FACTOR
  order: 2
  type: rule
  principle: 構造用鋼材の材料強度とJIS規格品補正
  conclusion: 鋼材の材料強度は圧縮・引張・曲げでF、せん断でF/√3とする。告示で対象とするJIS適合炭素鋼では、材料強度用の基準強度を許容応力度用の値の1.1倍以下にできる。許容応力度への一律の1.1倍加算ではない。
  reason: 教材に記載なし
  conditions:
  - 建築基準法施行令第96条の材料強度
  - 1.1倍以下の特例は平成12年建設省告示第2464号第三の対象JIS適合品
  - 材料強度用Fと許容応力度用Fを区別する
  source:
    pages:
    - 159
    - 177
    - 182
    question_codes:
    - '19165'
    - '23303'
    authoritative_sources:
    - kind: law
      title: 建築基準法施行令（e-Gov現行本文、2026-10-06照合）
      locator: 第96条表一（材料強度用のFについては告示2464号も参照）
      url: https://laws.e-gov.go.jp/law/325CO0000000338
      supports:
      - statement
      - conditions
    - kind: local_government
      title: 大阪府 構造計算適合性判定 指摘事例集 2021年版（2023年一部改正版）
      locator: B-1・1.1 材料強度の設定
      url: https://www.pref.osaka.lg.jp/documents/35034/09_btyuuikannkizikou_1.pdf
      supports:
      - statement
      - conditions
  prerequisites:
  - S-K6-STEEL-F-VALUE-DEFINITION
  editorial_status: source_checked
  question:
    prompt: 対象JIS鋼材に認められる基準強度の1.1倍以下の特例の適用先について、正しい結論はどちらか。
    choices:
      A: 材料強度を算定する基準強度
      B: 短期許容応力度を算定する基準強度
    correct: A
  display_content:
    rule: 鋼材の材料強度は圧縮・引張・曲げでF、せん断でF/√3とする。告示で対象とするJIS適合炭素鋼では、材料強度用の基準強度を許容応力度用の値の1.1倍以下にできる。許容応力度への一律の1.1倍加算ではない。
    applicability:
    - 建築基準法施行令第96条の材料強度
    - 1.1倍以下の特例は平成12年建設省告示第2464号第三の対象JIS適合品
    - 材料強度用Fと許容応力度用Fを区別する
    numbers_exceptions:
    - 1.1倍以下の特例は平成12年建設省告示第2464号第三の対象JIS適合品
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-WELD-ALLOWABLE-STRESS-FULL-PENETRATION
  order: 3
  type: rule
  principle: 完全溶込み溶接部の許容応力度
  conclusion: 完全溶込み溶接部は、長期の圧縮・引張・曲げをF/1.5、長期せん断をF/(1.5√3)、短期の圧縮・引張・曲げをF、短期せん断をF/√3とする。
  reason: 教材に記載なし
  conditions:
  - 建築基準法施行令第92条の突合せ溶接に相当する完全溶込み溶接
  - 母材鋼種に応じた適切な溶接材料を使用
  - Fは許容応力度用の溶接部基準強度
  source:
