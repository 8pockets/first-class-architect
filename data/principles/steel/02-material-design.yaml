- id: S-K6-STEEL-YOUNGS-MODULUS-STRENGTH-INDEPENDENT
  order: 8
  type: principle
  principle: 鋼材強度とヤング係数
  conclusion: 鋼材の強度が変わっても、ヤング係数Eは一定である。
  reason: 教材に記載なし
  conditions:
  - 鋼種の強度だけを変えて比較する場合
