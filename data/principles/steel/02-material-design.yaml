    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-WELD-ALLOWABLE-STRESS-NONFULL-PENETRATION
  order: 4
  type: rule
  principle: 完全溶込み以外の溶接部の許容応力度
  conclusion: 施行令第92条の突合せ以外の溶接（すみ肉溶接等）は、のど断面の長期許容応力度をF/(1.5√3)、短期をF/√3とする。材料強度は第98条により定め、材料強度用Fと許容応力度用Fを混同しない。
  reason: 教材に記載なし
  conditions:
  - すみ肉溶接等の有効のど断面
  - 許容応力度の比較には同じ溶接部基準強度Fを用いる
  - 部分溶込み溶接の使用可否は別に確認する
  source:
