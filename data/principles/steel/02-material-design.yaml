  question:
    prompt: 基準強度F=300N/mm²の完全溶込み溶接の長期許容引張応力度について、正しい結論はどちらか。
    choices:
      A: 約173N/mm²
      B: 200N/mm²
    correct: B
  display_content:
    rule: 完全溶込み溶接部は、長期の圧縮・引張・曲げをF/1.5、長期せん断をF/(1.5√3)、短期の圧縮・引張・曲げをF、短期せん断をF/√3とする。
    applicability:
