- id: S-K6-STEEL-F-VALUE-DEFINITION
  order: 6
  type: rule
  principle: 鋼材の基準強度Fの決め方
  conclusion: 基準強度Fは、降伏点の下限値と引張強度の下限値の70%を比較し、小さい方とする。
  reason: 教材に記載なし
  conditions:
  - 鋼材の基準強度Fを定める場合
