- id: S-K6-STEEL-DIAMETER-THICKNESS-RATIO-SMALLER-PREFERRED
  order: 5
  type: rule
  principle: 径厚比の大小
  conclusion: 円形鋼管では径厚比D/tが小さい方が、同じ径に対する板厚が厚くなり局部座屈を抑えやすい。
  reason: 教材に記載なし
  conditions:
  - 円形鋼管の局部座屈に関する比較
  - 同じ鋼種・外径・載荷条件
  - 軽量化などを含む設計全体の最適性とは別の比較
  source:
    pages:
    - 177
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 外径D=300mmの円形鋼管で、板厚を6mmから9mmへ増す場合の径厚比D/tについて、正しい結論はどちらか。
    choices:
      A: 約33から50へ大きくなる
      B: 50から約33へ小さくなる
    correct: B
  display_content:
    rule: 円形鋼管では径厚比D/tが小さい方が、同じ径に対する板厚が厚くなり局部座屈を抑えやすい。
    applicability:
    - 円形鋼管の局部座屈に関する比較
    - 同じ鋼種・外径・載荷条件
    - 軽量化などを含む設計全体の最適性とは別の比較
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-STEEL-F-VALUE-DEFINITION
  order: 6
  type: rule
  principle: 鋼材の基準強度Fの決め方
  conclusion: 教材の基本的なF値の考え方は、規格の降伏点下限と引張強さ下限の0.7倍のうち小さい値を採ることである。実際の設計用Fは、鋼種・板厚に対応する告示値又は認定値を確認する。
  reason: 教材に記載なし
  conditions:
  - 教材のF値決定の基本則を問う場合
  - 実測した降伏点・引張強さをそのままFに代入しない
  source:
    pages:
    - 177
    - 182
    question_codes:
    - '19165'
    - '23303'
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 降伏点下限325N/mm²、引張強さ下限490N/mm²を教材の基本則に当てはめたF値について、正しい結論はどちらか。
    choices:
      A: 343N/mm²
      B: 325N/mm²
    correct: B
  display_content:
    rule: 教材の基本的なF値の考え方は、規格の降伏点下限と引張強さ下限の0.7倍のうち小さい値を採ることである。実際の設計用Fは、鋼種・板厚に対応する告示値又は認定値を確認する。
    applicability:
    - 教材のF値決定の基本則を問う場合
    - 実測した降伏点・引張強さをそのままFに代入しない
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-STEEL-YIELD-RATIO-SMALLER-PREFERRED
  order: 7
  type: principle
  principle: 降伏比の大小
  conclusion: 降伏比は降伏点を引張強さで割った値である。同じ引張強さなら降伏比が小さいほど降伏後の強度余裕が大きい。局部座屈や接合部の早期破断を防いだ部材では塑性化領域を広げやすく、塑性変形能力を確保しやすい。
  reason: 降伏点に対する引張強さの余裕が大きく、降伏後の耐力上昇とともに塑性化する部材範囲を長くできるため。設問のXは325÷500×100=65%、Yは450÷500×100=90%となる。
  conditions:
  - 塑性変形能力を重視する鋼材の概略比較
  - 降伏比だけで部材・接合部全体の靭性が保証されるものではない
  - 同等の断面・荷重条件で比較し、局部座屈や接合部破断が先行しない場合
  source:
    pages:
    - 177
    question_codes: []
    authoritative_sources:
    - kind: professional_body
      title: 日本鉄鋼連盟 鉄骨造建物の耐震・耐津波安全性と鋼材について
      locator: 2013年3月改訂／冊子P9–10（PDF6頁）「降伏比」「降伏比の上限値」「降伏比の影響」
      url: https://www.jisf.or.jp/business/tech/infrastructure/docs/infrastructure_pdf_02.pdf
      supports:
      - statement
      - explanation
      - conditions
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 降伏点X=325・Y=450N/mm²、引張強さはいずれも500N/mm²の鋼材を比較する。早期の座屈・破断を抑えた同等の部材について、正しい結論はどちらか。
    choices:
      A: Xの降伏比は65%で、塑性化領域はYより広がりやすい
      B: Xの降伏比は90%で、塑性化領域はYより狭まりやすい
    correct: A
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-STEEL-YOUNGS-MODULUS-STRENGTH-INDEPENDENT
  order: 8
  type: rule
  principle: 鋼材強度とヤング係数
  conclusion: 常温の通常の構造用鋼では、SN400からSN490へ鋼種の強度を変えても、設計上のヤング係数Eを同じ値として扱う。
  reason: 教材に記載なし
  conditions:
  - 常温・弾性範囲
  - SN400とSN490など通常の構造用鋼
  - 火災時の高温状態は対象外
  source:
    pages:
    - 177
    - 192
    question_codes:
    - '03173'
    - '20161'
    - '27173'
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 常温のSN400からSN490へ鋼種だけを変更した場合の、弾性域の応力-ひずみ関係の傾きについて、正しい結論はどちらか。
    choices:
      A: 設計上は490/400倍になる
      B: 設計上は変わらない
    correct: B
  display_content:
    rule: 常温の通常の構造用鋼では、SN400からSN490へ鋼種の強度を変えても、設計上のヤング係数Eを同じ値として扱う。
    applicability:
    - 常温・弾性範囲
    - SN400とSN490など通常の構造用鋼
    - 火災時の高温状態は対象外
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-STEEL-YOUNGS-MODULUS-VS-CONCRETE
  order: 9
  type: rule
  principle: 鋼材とコンクリートのヤング係数
  conclusion: 鋼材のヤング係数は通常のコンクリートの概ね10倍程度である。ただしコンクリートのEは圧縮強度・単位容積質量などで変わり、厳密な一定比ではない。
  reason: 教材に記載なし
  conditions:
  - 常温の通常の構造用鋼と普通コンクリートの概略比較
  source:
    pages:
    - 177
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 鋼材Eを2.0×10^5N/mm²としたとき、教材の概略比に対応する普通コンクリートEについて、正しい結論はどちらか。
    choices:
      A: 約2.0×10^5N/mm²
      B: 約2.0×10^4N/mm²
    correct: B
  display_content:
    rule: 鋼材のヤング係数は通常のコンクリートの概ね10倍程度である。ただしコンクリートのEは圧縮強度・単位容積質量などで変わり、厳密な一定比ではない。
    applicability:
    - 常温の通常の構造用鋼と普通コンクリートの概略比較
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
