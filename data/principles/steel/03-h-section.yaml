- id: S-K6-H-SECTION-STRONG-AXIS-LATERAL-RESTRAINT
  order: 4
  type: rule
  principle: 強軸曲げを受けるH形鋼の横座屈対応
  question: 強軸曲げを受けるH形鋼の横座屈への対応について、結論、その理由及び結論を左右する条件を述べなさい。
  conclusion: 強軸まわりに曲げを受けるH形鋼は、横補剛材を設けるか許容圧縮応力度を低減する。
  reason: 強軸まわりの曲げでは横座屈しやすいため。
  conditions:
  - H形鋼が強軸まわりに曲げを受ける場合
