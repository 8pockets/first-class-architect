  principle: H形鋼の強軸・弱軸
  conclusion: H形鋼は強軸まわりでは曲がりにくく、弱軸まわりでは曲がりやすい。
  reason: 教材に記載なし
  conditions:
  - 同じH形鋼断面の曲げ方向を比較する場合
