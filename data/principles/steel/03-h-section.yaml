    - '30163'
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
- id: S-K6-H-SECTION-AXIS-LATERAL-BUCKLING
  order: 3
  type: principle
  principle: H形鋼の曲げ軸と横座屈
  conclusion: 弱軸まわりの曲げでは横座屈しにくく、強軸まわりの曲げでは横座屈しやすい。
  reason: H形断面の強軸曲げでは、圧縮側フランジが弱軸方向へ曲がる変形と断面のねじれが連成しやすいため。
  conditions:
  - 二軸対称のH形鋼梁
  - 同じ横補剛条件で強軸曲げと弱軸曲げを比較する場合
  source:
    pages:
    - 178
    - 193
    question_codes:
    - '04164'
    - 07182
    - '21151'
    - '25163'
  prerequisites:
  - S-K6-H-SECTION-STRONG-WEAK-AXIS-RIGIDITY
  editorial_status: source_checked
  question:
    prompt: 同じH形鋼梁で横補剛条件を同じとしたとき、横座屈に対する検討が特に重要となる曲げ方向について、正しい結論はどちらか。
    choices:
      A: 弱軸まわりの曲げ
      B: 強軸まわりの曲げ
    correct: B
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-H-SECTION-STRONG-AXIS-LATERAL-RESTRAINT
  order: 4
  type: rule
  display_content:
    rule: 強軸曲げを受けるH形鋼梁は横座屈を検討し、必要な横補剛を設ける。許容曲げ応力度は横補剛間隔などによる横座屈の影響を考慮する。
    applicability:
    - H形鋼梁の強軸曲げ
    - 横補剛により圧縮側フランジの横移動や断面のねじれを拘束する
    numbers_exceptions:
    - 強軸曲げを受けるH形鋼梁は横座屈を検討し、必要な横補剛を設ける。許容曲げ応力度は横補剛間隔などによる横座屈の影響を考慮する。
  principle: 強軸曲げを受けるH形鋼の横座屈対応
  question:
    prompt: 強軸曲げを受けるH形鋼梁の横座屈を抑える横補剛で、重点的に拘束する側として正しい結論はどちらか。
    choices:
      A: 圧縮側フランジを拘束する
      B: 引張側だけを横方向に拘束する
    correct: A
  conclusion: 強軸曲げを受けるH形鋼梁は横座屈を検討し、必要な横補剛を設ける。許容曲げ応力度は横補剛間隔などによる横座屈の影響を考慮する。
  reason: 強軸まわりの曲げでは横座屈しやすいため。
  conditions:
  - H形鋼梁の強軸曲げ
  - 横補剛により圧縮側フランジの横移動や断面のねじれを拘束する
  source:
    pages:
