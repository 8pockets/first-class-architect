  title: H形鋼の断面特性
  order: 4
principles:
- id: S-K6-NO-LATERAL-BUCKLING-SECTION-ALLOWABLE-BENDING
  order: 1
  type: rule
  principle: 横座屈しない断面の許容曲げ応力度
  question: 横座屈のおそれがない断面又は曲げ軸の許容曲げ応力度について、結論、その理由及び結論を左右する条件を述べなさい。
  conclusion: 鋼管・箱形断面、又は弱軸曲げを受ける対称H形断面は、幅厚比・径厚比の制限を満たせば、材長にかかわらず許容曲げ応力度を許容引張応力度と同じ値にできる。
  reason: これらの条件では横座屈のおそれがなく、局部座屈も制限されるため。
  conditions:
  - 横座屈のおそれがない断面・曲げ軸
  - 幅厚比又は径厚比の制限を満足
  - H形鋼が弱軸まわりに曲げを受ける場合
  - 教材図の横座屈による低減を要しない扱い
  - 角形鋼管または円形鋼管
  - 幅厚比制限に従い、局部座屈しない場合
