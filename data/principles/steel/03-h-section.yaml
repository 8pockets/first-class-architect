- id: S-K6-STEEL-COMPRESSION-CAPACITY-BUCKLING
  order: 6
  type: principle
  principle: 圧縮耐力の座屈支配
  question:
    prompt: 鋼製圧縮材の耐力と座屈の関係について、正しい結論はどちらか。
    choices:
      A: 座屈の有無にかかわらず、圧縮耐力は引張耐力と同等とする。
      B: 座屈しなければ引張耐力と同等だが、先に座屈する場合は座屈時の耐力とする。
    correct: B
  conclusion: 座屈のおそれがなければ圧縮耐力・許容圧縮応力度は引張側と同等だが、それより小さい荷重で座屈する場合は座屈時の耐力まで低減する。
  reason: 鋼材は圧縮力を受けると座屈する場合があり、座屈しない場合だけ座屈による耐力低減を考慮する必要がないため。
  conditions:
  - 圧縮力を受ける鋼部材
  - 座屈耐力と引張側の耐力・許容応力度を比較する場合
  source:
    pages:
