- id: S-K6-H-SECTION-STRONG-WEAK-AXIS-RIGIDITY
  order: 5
  type: identification
  principle: H形鋼の強軸・弱軸
  conclusion: H形鋼は強軸まわりでは曲がりにくく、弱軸まわりでは曲がりやすい。
  reason: 教材に記載なし
  conditions:
  - 同じH形鋼断面の曲げ方向を比較する場合
  source:
    pages:
    - 178
    - 193
    question_codes:
    - '04164'
    - 07182
    - '21151'
    - '25163'
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 同じH形鋼断面の強軸・弱軸まわりの曲がりやすさについて、正しい結論はどちらか。
    choices:
      A: 強軸まわりの方が曲がりにくい
      B: 弱軸まわりの方が曲がりにくい
    correct: A
  display_content:
    definition: H形鋼は強軸まわりでは曲がりにくく、弱軸まわりでは曲がりやすい。
    distinguishing_conditions:
    - 同じH形鋼断面の曲げ方向を比較する場合
    confusable_points:
    - 本問では「弱軸まわりの方が曲がりにくい」と区別する。
