- id: S-K6-H-SECTION-STRONG-AXIS-LATERAL-RESTRAINT
  order: 4
  type: rule
  display_content:
    rule: 強軸まわりに曲げを受けるH形鋼は、横補剛材を設けるか許容圧縮応力度を低減する。
    applicability:
    - H形鋼が強軸まわりに曲げを受ける場合
    numbers_exceptions: []
  principle: 強軸曲げを受けるH形鋼の横座屈対応
  question:
    prompt: 強軸曲げを受けるH形鋼で、許容圧縮応力度を低減せずに横座屈へ対応する場合、正しい結論はどちらか。
    choices:
      A: 横補剛材を設ける
      B: 横補剛材を設けない
    correct: A
  conclusion: 強軸まわりに曲げを受けるH形鋼は、横補剛材を設けるか許容圧縮応力度を低減する。
  reason: 強軸まわりの曲げでは横座屈しやすいため。
  conditions:
  - H形鋼が強軸まわりに曲げを受ける場合
  source:
