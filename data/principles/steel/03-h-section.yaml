- id: S-K6-STEEL-COMPRESSION-CAPACITY-BUCKLING
  order: 6
  type: principle
  principle: 座屈の有無と圧縮耐力
  question: 鋼部材の座屈の有無が圧縮耐力の評価に与える影響について、結論、その理由及び結論を左右する条件を説明しなさい。
  conclusion: 座屈しなければ圧縮耐力は引張耐力と同じだが、それより小さい荷重で座屈する場合は座屈時の耐力を圧縮耐力とみなす。
  reason: 鋼材は圧縮力を受けると座屈する場合があるため。
  conditions:
  - 圧縮力を受ける鋼部材
  - 座屈耐力と引張耐力を比較する場合
