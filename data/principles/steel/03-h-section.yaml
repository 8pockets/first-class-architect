- id: S-K6-H-SECTION-AXIS-LATERAL-BUCKLING
  order: 3
  type: principle
  principle: H形鋼の曲げ軸と横座屈
  conclusion: 弱軸まわりの曲げでは横座屈しにくく、強軸まわりの曲げでは横座屈しやすい。
  reason: 教材に記載なし
  conditions:
  - H形鋼が曲げを受ける場合
  source:
