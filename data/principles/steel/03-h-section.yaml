- id: S-K6-BEAM-LATERAL-BUCKLING-COUNTERMEASURES
  order: 2
  type: rule
  display_content:
    rule: 横座屈対策は、圧縮フランジの支点間距離を短くする、小梁・横補剛材を設ける、箱形鋼を用いる、弱軸まわりの細長比を小さくすることである。
    applicability:
    - 横座屈のおそれがある梁
    - H形鋼梁
    numbers_exceptions: []
  principle: 横座屈の抑制方法
  question:
    prompt: 横座屈のおそれがあるH形鋼梁で、圧縮フランジの支点間距離をどうするかについて、正しい結論はどちらか。
    choices:
      A: 支点間距離を短くする
      B: 支点間距離を長くする
    correct: A
  conclusion: 横座屈対策は、圧縮フランジの支点間距離を短くする、小梁・横補剛材を設ける、箱形鋼を用いる、弱軸まわりの細長比を小さくすることである。
  reason: 細長比が大きいほど弱軸方向へ座屈しやすいため。
  conditions:
  - 横座屈のおそれがある梁
  - H形鋼梁
  source:
