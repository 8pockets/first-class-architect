  editorial_status: source_checked
- id: S-K6-BEAM-TYPES-ROLLED-BUILT-UP
  order: 2
  type: identification
  principle: 形鋼梁と組立梁の識別
  conclusion: 形鋼梁にはH形鋼梁・I形鋼梁があり、組立梁にはトラス梁・ラチス梁がある。
  reason: 教材に記載なし
  conditions:
  - 梁を製作形式で識別する場合
