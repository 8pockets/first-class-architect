  title: 梁の種類・継手
  order: 22
principles:
- id: S-K6-BEAM-SPLICE-METHODS-FIELD-SHOP
  order: 1
  type: identification
  principle: 梁継手の接合方法と現場・工場の使い分け
  question: 鉄骨梁の継手・仕口について、接合方法と現場・工場での使い分けを識別して結論を述べ、その理由と、使い分けを判断する条件を説明しなさい。
  conclusion: 梁継手には高力ボルト継手、高力ボルトと溶接の併用継手、溶接継手があり、現場継手は高力ボルト接合、品質を安定させやすい工場仕口は溶接接合とすることが多い。
  reason: 現場溶接は施工条件の影響を受けやすく、工場溶接は品質を安定させやすいため。
  conditions:
  - 鉄骨梁の継手・仕口
  - 現場接合か工場製作かを区別する
  source:
    pages:
    - 196
    question_codes: []
  prerequisites:
