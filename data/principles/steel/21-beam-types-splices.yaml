version: 1
section:
  id: K6-21
  title: 梁の種類・継手
  order: 22
principles:
- id: S-K6-BEAM-SPLICE-METHODS-FIELD-SHOP
  order: 1
  type: identification
  display_content:
    definition: 梁継手には高力ボルト継手、高力ボルトと溶接の併用継手、溶接継手があり、現場継手は高力ボルト接合、工場仕口は溶接接合とすることが多い。
    distinguishing_conditions:
    - 鉄骨梁の継手・仕口
    - 現場接合か工場製作かを区別する
    confusable_points:
    - 「現場は溶接、工場は高力ボルトを用いる」とは区別する。
  principle: 現場継手と工場仕口の接合方法
  question:
    prompt: 鉄骨梁の現場継手と工場仕口について、一般的な接合方法の組合せとして正しい結論はどちらか。
    choices:
      A: 現場は高力ボルト、工場は溶接を用いる
      B: 現場は溶接、工場は高力ボルトを用いる
    correct: A
  conclusion: 梁継手には高力ボルト継手、高力ボルトと溶接の併用継手、溶接継手があり、現場継手は高力ボルト接合、工場仕口は溶接接合とすることが多い。
  reason: 現場溶接は施工条件の影響を受けやすく、工場溶接は品質を安定させやすいため。
  conditions:
  - 鉄骨梁の継手・仕口
  - 現場接合か工場製作かを区別する
  source:
    pages:
    - 196
    - 206
    question_codes: []
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
- id: S-K6-BEAM-TYPES-ROLLED-BUILT-UP
  order: 2
  type: identification
  principle: 形鋼梁と組立梁の識別
  conclusion: 圧延H形鋼・I形鋼を用いる梁を形鋼梁、鋼板や複数部材を組み立てる梁を組立梁という。組立H形鋼もあるのでH形という断面形状だけでは製作形式を決めない。
  reason: 教材に記載なし
  conditions:
  - 断面形状と製作方法を区別する場合
  source:
    pages:
    - 196
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 鋼板のフランジとウェブを溶接してH形断面に製作した梁の分類について、正しい結論はどちらか。
    choices:
      A: 組立梁
      B: 圧延形鋼梁
    correct: A
  display_content:
    definition: 圧延H形鋼・I形鋼を用いる梁を形鋼梁、鋼板や複数部材を組み立てる梁を組立梁という。組立H形鋼もあるのでH形という断面形状だけでは製作形式を決めない。
    distinguishing_conditions:
    - 断面形状と製作方法を区別する場合
    confusable_points:
    - 本問では「圧延形鋼梁」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
