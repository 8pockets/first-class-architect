  title: 全体座屈と細長比
  order: 19
principles:
- id: S-K6-18-ELASTIC-STRENGTH
  order: 1
  type: principle
  principle: 弾性座屈領域と鋼材強度
  question: 圧縮材が弾性座屈領域にあるとき、基準強度を変えた場合の許容圧縮応力度の扱いを述べ、その理由と、この結論が成り立つ条件を説明しなさい。
  conclusion: 細長比λが限界細長比Λ以上の弾性座屈領域では、許容圧縮応力度はヤング係数Eとλで決まり、基準強度Fを高くしても変わらない。
  reason: 弾性座屈域の座屈耐力はオイラー座屈荷重π²EI/Lk²で決まり、鋼材強度Fを含まないため。
  conditions:
  - 圧縮材
  - 細長比λが限界細長比Λ以上
  - 断面・座屈長さ・ヤング係数Eが同じ
  source:
    pages:
    - 164
    - 193
    question_codes:
    - '01161'
    - '02153'
  prerequisites:
  - S-K6-18-SLENDERNESS
  - S-K6-LIMIT-SLENDERNESS-STRENGTH-RELATION
  editorial_status: source_checked
- id: S-K6-18-SLENDERNESS
  order: 2
  type: principle
  principle: 全体座屈と細長比
  question: 圧縮材の座屈長さ又は断面二次半径が変わると、細長比、全体座屈のしやすさ及び許容圧縮応力度がどうなるかという結論を述べ、その理由と、この関係を用いる対象・比較条件を説明しなさい。
  conclusion: 圧縮材の細長比はλ=Lk/iで表し、座屈長さLkが短いほど、また断面二次半径iが大きいほど細長比は小さくなり、全体座屈しにくく許容圧縮応力度は大きくなる。
  reason: 材端支持条件は座屈長さLkを、断面形状と座屈軸は断面二次半径iを左右し、細長比が大きいほど座屈しやすいため。
  conditions:
  - 圧縮材
  - 鋼材・断面・材端支持条件の違いをLkとiで比較する場合
  source:
    pages:
    - 164
    - 165
    - 177
    - 193
    question_codes:
