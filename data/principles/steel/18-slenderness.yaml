- id: S-K6-EFFECTIVE-SLENDERNESS-MAXIMUMS
  order: 3
  type: rule
  principle: 圧縮材の有効細長比上限
  conclusion: 圧縮力を負担する主要柱は200以下、柱以外は250以下、ラチス材は160以下とする。
  reason: 教材に記載なし
  conditions:
  - 圧縮力を負担する構造耐力上主要な部材
  - 柱は200以下
  - 柱以外は250以下
  - ラチス材は160以下
  source:
