- id: S-K6-LIMIT-SLENDERNESS-STRENGTH-RELATION
  order: 4
  type: principle
  principle: 限界細長比と基準強度
  question: 圧縮材の限界細長比とは何を示し、基準強度を変えるとどうなるかという結論を述べ、その理由と、この関係を用いる条件を説明しなさい。
  conclusion: 応力度が基準強度Fの60%となる弾性座屈・非弾性座屈の境界を限界細長比といい、Λ=√(π²E/(0.6F))である。Fが大きいほどΛは小さくなる。
  reason: Λの式でFが分母にあるため。
  conditions:
  - 圧縮材の弾性座屈・非弾性座屈の境界
  - 圧縮材の弾性座屈領域と非弾性座屈領域を区別する場合
  source:
    pages:
    - 164
    - 193
    question_codes:
