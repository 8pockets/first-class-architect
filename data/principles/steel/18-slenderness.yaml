  title: 全体座屈と細長比
  order: 19
principles:
- id: S-K6-18-ELASTIC-STRENGTH
  order: 1
  type: principle
  principle: 弾性座屈領域と鋼材強度
  question:
    prompt: 細長比λが限界細長比Λ以上で、断面・座屈長さ・ヤング係数Eが同じ圧縮材について、基準強度Fを高くしたときの許容圧縮応力度として正しい結論はどちらか。
    choices:
      A: 許容圧縮応力度は変わらない
      B: 許容圧縮応力度は大きくなる
    correct: A
  conclusion: 細長比λが限界細長比Λ以上の弾性座屈領域では、許容圧縮応力度はヤング係数Eとλで決まり、基準強度Fを高くしても変わらない。
  reason: 弾性座屈域の座屈耐力はオイラー座屈荷重π²EI/Lk²で決まり、鋼材強度Fを含まないため。
  conditions:
  - 圧縮材
  - 細長比λが限界細長比Λ以上
  - 断面・座屈長さ・ヤング係数Eが同じ
  source:
    pages:
    - 164
    - 193
    question_codes:
    - '01161'
    - '02153'
  prerequisites:
  - S-K6-18-SLENDERNESS
  - S-K6-LIMIT-SLENDERNESS-STRENGTH-RELATION
  editorial_status: source_checked
- id: S-K6-18-SLENDERNESS
  order: 2
  type: principle
  principle: 全体座屈と細長比
  question:
    prompt: 断面二次半径iが同じ圧縮材で座屈長さLkを短くしたとき、細長比λの変化として正しい結論はどちらか。
    choices:
      A: 細長比λは小さくなる
      B: 細長比λは大きくなる
    correct: A
  conclusion: 圧縮材の細長比はλ=Lk/iで表し、座屈長さLkが短いほど、また断面二次半径iが大きいほど細長比は小さくなり、全体座屈しにくく許容圧縮応力度は大きくなる。
  reason: 材端支持条件は座屈長さLkを、断面形状と座屈軸は断面二次半径iを左右し、細長比が大きいほど座屈しやすいため。
  conditions:
  - 圧縮材
  - 鋼材・断面・材端支持条件の違いをLkとiで比較する場合
  source:
    pages:
    - 164
    - 165
    - 177
    - 193
    question_codes:
    - '01152'
    - '04163'
    - '05172'
    - 07184
    - '18162'
    - '22152'
    - '27164'
    - '28172'
    - '29254'
    - '29302'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-EFFECTIVE-SLENDERNESS-MAXIMUMS
  order: 3
  type: rule
  principle: 圧縮材の有効細長比上限
  conclusion: 圧縮材の有効細長比は、主要な柱を200以下、柱以外を250以下とする。教材に示すラチス材の160以下は別の部材条件の制限として区別する。
  reason: 教材に記載なし
  conditions:
  - 圧縮力を負担する構造耐力上主要な部材
  - 柱・柱以外の上限は施行令第65条
  - 有効細長比の制限と圧縮耐力の照査は別に行う
  source:
    pages:
    - 164
    - 193
    question_codes:
    - '01152'
    - '04163'
    - '05172'
    - 07184
    - '18162'
    - '22152'
    - '23153'
    - '28172'
    - '29254'
    - '29302'
    authoritative_sources:
    - kind: law
      title: 建築基準法施行令（e-Gov現行本文、2026-10-06照合）
      locator: 第65条（柱200・柱以外250）
      url: https://laws.e-gov.go.jp/law/325CO0000000338
      supports:
      - statement
      - conditions
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
  question:
    prompt: 有効細長比220の圧縮材を主要な柱として用いる計画の上限照査について、正しい結論はどちらか。
    choices:
      A: 柱の上限200を超える
      B: 柱の上限250以内に収まる
    correct: A
  display_content:
    rule: 圧縮材の有効細長比は、主要な柱を200以下、柱以外を250以下とする。教材に示すラチス材の160以下は別の部材条件の制限として区別する。
    applicability:
    - 圧縮力を負担する構造耐力上主要な部材
    - 柱・柱以外の上限は施行令第65条
    - 有効細長比の制限と圧縮耐力の照査は別に行う
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-LIMIT-SLENDERNESS-STRENGTH-RELATION
  order: 4
  type: principle
  principle: 限界細長比と基準強度
  question:
    prompt: ヤング係数Eが同じ圧縮材で基準強度Fを大きくしたとき、限界細長比Λの変化として正しい結論はどちらか。
    choices:
      A: 限界細長比Λは大きくなる
      B: 限界細長比Λは小さくなる
    correct: B
  conclusion: 応力度が基準強度Fの60%となる弾性座屈・非弾性座屈の境界を限界細長比といい、Λ=√(π²E/(0.6F))である。Fが大きいほどΛは小さくなる。
  reason: Λの式でFが分母にあるため。
  conditions:
  - 圧縮材の弾性座屈・非弾性座屈の境界
  - 圧縮材の弾性座屈領域と非弾性座屈領域を区別する場合
  source:
    pages:
    - 164
    - 193
    question_codes:
    - '01161'
    - '02153'
    - '04161'
    - '24152'
    - '27163'
  prerequisites: []
  editorial_status: source_checked
