  title: ブレースの偏心・有効断面
  order: 26
principles:
- id: S-K6-ANGLE-CHANNEL-BRACE-EFFECTIVE-AREA
  order: 1
  type: principle
  principle: 山形鋼・溝形鋼筋かいの有効断面積
  question: 片側接合の山形鋼・溝形鋼引張ブレースについて、有効断面積の求め方を述べ、その理由と、ボルト孔・突出脚・接合形式など結論を左右する条件を説明しなさい。
  conclusion: 片側接合の山形鋼・溝形鋼引張ブレースは、全断面からボルト孔欠損と突出脚の無効部分を差し引いて有効断面積を求める。無効部分はボルト本数で決まる無効長さと板厚の積とし、簡略には突出脚の1/2を無効とする場合がある。
  reason: 接合されない突出脚にはせん断遅れによる無効部分があり、孔欠損部も引張力を伝えないため。
  conditions:
  - 山形鋼又は溝形鋼の引張筋かい
  - ボルト接合
  - 山形鋼又は溝形鋼
  - ガセットプレート片側だけに接合
  - 山形鋼または溝形鋼の片側接合
  - 引張ブレース
  - ボルト孔欠損も別途控除
  source:
