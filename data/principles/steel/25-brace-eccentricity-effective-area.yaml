- id: S-K6-BRACE-ECCENTRIC-JOINT-EFFECTS
  order: 2
  type: principle
  principle: 筋かい接合の偏心
  question: 筋かいを柱へ接合するとき、偏心の扱いと、偏心を避けられない場合の設計上の対応について結論を述べ、その理由と、適用条件を説明しなさい。
  conclusion: 筋かいは柱へ偏心接合しないようにし、やむを得ない場合は偏心曲げを含む応力を解析して柱・接合部を設計する。
  reason: 偏心曲げモーメントが接合部や柱へ付加応力を生じ、接合部破壊につながるため。
  conditions:
  - 筋かい材が柱材へ偏心して接合
  - ブレースと柱梁の接合納まり
  source:
    pages:
