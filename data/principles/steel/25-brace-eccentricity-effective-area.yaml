- id: S-K6-ANGLE-CHANNEL-BRACE-EFFECTIVE-AREA
  order: 1
  type: principle
  principle: 山形鋼・溝形鋼筋かいの有効断面積
  question:
    prompt: 片側接合の単一山形鋼ブレースを許容応力度計算する。孔欠損を控除済みの断面積について、正しい結論はどちらか。
    choices:
      A: 突出部は全て有効として控除しない
      B: 突出部の1/2も無効として控除する
    correct: B
  conclusion: 片側接合の山形鋼・溝形鋼引張ブレースでは、ボルト孔欠損に加えて突出脚の無効部分を控除する。許容応力度計算では一般に突出部の1/2を無効とし、破断耐力算定用のボルト本数に応じた有効断面積算定式と区別する。
  reason: 接合されない突出脚にはせん断遅れによる無効部分があり、孔欠損部も引張力を伝えないため。
  conditions:
  - 山形鋼又は溝形鋼の引張筋かい
  - ガセットプレートの片側へボルト接合
  - 許容応力度計算と破断耐力算定の有効断面積を混同しない
  source:
