- id: S-K6-BRACE-ECCENTRIC-JOINT-EFFECTS
  order: 2
  type: principle
  principle: 筋かい接合の偏心
  question:
    prompt: 筋かいを柱へ偏心接合せざるを得ない場合、柱・接合部の設計で考慮する応力として正しい結論はどちらか。
    choices:
      A: 偏心曲げを含む応力で設計する
      B: 偏心曲げを含まない応力で設計する
    correct: A
  conclusion: 筋かいは柱へ偏心接合しないようにし、やむを得ない場合は偏心曲げを含む応力を解析して柱・接合部を設計する。
  reason: 偏心曲げモーメントが接合部や柱へ付加応力を生じ、接合部破壊につながるため。
  conditions:
  - 筋かい材が柱材へ偏心して接合
  - ブレースと柱梁の接合納まり
  source:
    pages:
    - 169
    - 200
    question_codes:
    - '26154'
