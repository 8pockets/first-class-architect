  title: 背中合わせ二丁使い
  order: 27
principles:
- id: S-K6-DOUBLE-ANGLE-BRACE-REDUCES-ECCENTRICITY
  order: 1
  type: principle
  principle: 山形鋼筋かいの両側対称配置
  question:
    prompt: 山形鋼・溝形鋼を背中合わせに2本使い、ガセットプレートの両側へ対称に取り付けた引張材について、偏心引張の影響として正しい結論はどちらか。
    choices:
      A: 片側へ1本取り付ける場合より小さくなる
      B: 片側へ1本取り付ける場合より大きくなる
    correct: A
  conclusion: 山形鋼・溝形鋼を背中合わせに2本使い、ガセットプレートの両側へ対称に取り付けると偏心引張の影響が小さくなり、全断面を有効とみなせる。
  reason: 1本を片側だけへ取り付ける配置より、接合が対称になり力の作用線を材軸へ近づけられるため。
  conditions:
  - 山形鋼筋かい
  - 小規模建築物を除く
  - 山形鋼または溝形鋼を背中合わせに2本使用
  - 引張材
