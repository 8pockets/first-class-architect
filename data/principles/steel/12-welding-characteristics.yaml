- id: S-K6-WELD-CONTINUOUS-STRESS-FLOW
  order: 6
  type: principle
  principle: 溶接接合の連続性と応力集中
  question:
    prompt: 教材が説明する一般的な溶接接合について、接合部の連続性が力の流れに与える影響として正しい結論はどちらか。
    choices:
      A: 力の流れが集中しにくい
      B: 力の流れが集中しやすい
