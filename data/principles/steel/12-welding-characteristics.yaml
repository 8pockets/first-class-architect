version: 1
section:
  id: K6-12
  title: 溶接接合の特徴
  order: 13
principles:
- id: S-K6-TACK-WELD-MINIMUM-BEAD
  order: 1
  type: rule
  principle: 組立溶接のショートビード防止
  question:
    prompt: 板厚が6mmを超える組立溶接について、最小ビード長として正しい結論はどちらか。
    choices:
      A: 40mm以上とする
      B: 30mm以上とする
    correct: A
  conclusion: 組立溶接は脚長4mm以上とし、最小ビード長を板厚6mm以下では30mm、6mm超では40mmとする。
  reason: 極端に短いビードは周囲の冷たい鋼材で急冷・硬化し、靭性が低下して応力や低温で割れやすくなるため。
  conditions:
  - 組立溶接
  - 板厚6mm以下又は6mm超
  - 板厚6mm超は40mm以上
  - 板厚6mm以下は30mm以上
  source:
    pages:
    - 162
    - 187
    question_codes:
    - 施工06143
    - 施工23142
    - '07162'
    - '24173'
    - '30154'
  prerequisites:
  - S-K6-PREHEAT-PREVENTS-LOW-TEMPERATURE-CRACKING
  editorial_status: source_checked
- id: S-K6-BOX-COLUMN-H-BEAM-RIGID-JOINT-WELD-TYPES
  order: 2
  type: principle
  principle: 梁継手のフランジ・ウェブ応力分担と溶接形式
  question:
    prompt: H形鋼梁の継手・柱梁仕口でフランジが主に負担すると仮定する応力として、正しい結論はどちらか。
    choices:
      A: せん断力を主に負担する
      B: 曲げモーメントを主に負担する
    correct: B
  conclusion: 梁継手は曲げモーメントとせん断力に対して設計し、一般に曲げモーメントをフランジ、せん断力をウェブが負担すると仮定する。溶接仕口ではフランジを完全溶込み溶接、ウェブを両面すみ肉溶接とする。
  reason: 曲げモーメントは主に梁フランジから柱へ、せん断力は梁ウェブから柱へ伝達されるため。
  conditions:
  - H形鋼梁の継手・柱梁仕口
  - 教材図の溶接仕口
  - 箱形断面柱とH形鋼梁の剛接合
  - 組立H形鋼を作る場合、または角形鋼管にH形鋼を溶接する場合
  - 梁側のフランジ・ウェブ接合形式を選ぶ場合
  source:
    pages:
    - 167
    - 187
    - 196
    - 207
    question_codes:
    - '20172'
    - '23173'
    - '26163'
  prerequisites: []
  editorial_status: source_checked
