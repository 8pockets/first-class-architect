review_method:
- 公式PDFの学科IV全30問×10年の全4肢をテキストで確認し、関連/除外理由を記録。
- 関連論点ごとにカードの対象・条件・結論を手作業で意味照合。単語一致は対応としない。
- 履歴図は公式原図を目視し、自作図設問を確認。一般構造力学の図計算は前提分野として別枠に記録。
- 既存又は補完カードの説明で対応するものを含む。265件すべてを265個の独立した小テストにしたという意味ではない。
