  editorial_status: source_checked
- id: S-K6-WIDTH-THICKNESS-LIMIT-MEANING
  order: 6
  type: identification
  principle: 幅厚比制限の意味
  conclusion: 『幅厚比の制限に従う』とは、局部座屈しないための幅厚比を満たすことを意味し、制限が厳しいほど許容される幅厚比は小さい。
  reason: 幅厚比が小さいほど板要素が厚く、局部座屈しにくいため。
  conditions:
  - 幅厚比制限の大小を解釈する場合
  source:
