version: 1
section:
  id: K6-38
  title: 演習：荷重変形履歴
  order: 39
principles:
- id: S-K6-BRACE-HYSTERESIS-BY-SLENDERNESS
  order: 1
  type: principle
  principle: 筋かい細長比による履歴特性の差
  question:
    prompt: 接合部の剛性・強度が十分なX形筋かい架構の自作履歴図を比較する。強度とグラフの尺度が同じとき、細長比と原点付近の抵抗について正しい結論はどちらか。
    figure: brace-loops-v1
    choices:
      A: 図1は小細長比、図2は大細長比に対応する
      B: 図1は大細長比、図2は小細長比に対応する
    correct: A
  conclusion: 細長比が大きいX形筋かい架構は小荷重で変形が進み原点付近のエネルギー吸収が小さい。細長比が小さいX形筋かい架構は圧縮筋かいが座屈しにくく、座屈後曲げ抵抗とエネルギー吸収が大きいが、繰返しで耐力が低下する。
  reason: 大細長比材は圧縮を負担できず、引張降伏後に伸びた筋かいが再び効くまで抵抗できない一方、小細長比材は圧縮座屈しにくく座屈後抵抗も大きいため。
  conditions:
  - X形筋かい架構へ繰返し水平荷重が作用する場合
  - 同じ基準強度で筋かい細長比の大小を比較
  source:
    pages:
    - 214
    - 215
    question_codes:
    - 05181
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
- id: S-K6-MOMENT-FRAME-HYSTERESIS
  order: 101
  type: principle
  principle: ラーメン架構の履歴特性
  question:
    prompt: 自作模式図の二つの履歴を比較する。局部座屈や破断を生じず柱・梁端部が安定して塑性化する鉄骨ラーメンに対応する図として、正しい結論はどちらか。
    figure: hysteresis-loops-v1
    choices:
      A: 幅のあるループを描く図1が対応する
      B: 中央がくびれたループを描く図2が対応する
    correct: A
  conclusion: ラーメン架構は変形増大とともに履歴ループ・強度・エネルギー吸収能力が増え、その履歴を平行四辺形状に近似できる。
  reason: 柱・梁端部の塑性化に伴って履歴ループが拡大し、ループで囲まれる面積が大きくなるため。
  conditions:
  - 鉄骨造ラーメン架構へ繰返し水平荷重が作用する場合
  - 荷重・変形履歴を模式化する場合
  - 図1は安定した塑性化、図2は圧縮座屈後の伸びが戻るまで抵抗が小さい筋かいの模式化である
  source:
    pages:
    - 214
    - 215
    question_codes:
    - 05181
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-HYSTERESIS-LOOP-AREA-ENERGY-ABSORPTION
  order: 2
  type: identification
  principle: 履歴曲線とエネルギー吸収能力
  conclusion: 荷重-変形履歴曲線の閉じたループの面積は、その1サイクルで吸収・消費するエネルギーを表す。面積そのものが最大耐力や初期剛性を表すわけではない。
  reason: 教材に記載なし
  conditions:
  - 同じ単位・尺度の荷重-変形グラフ
  - 同じ振幅等の条件で履歴特性を比較する
  source:
    pages:
    - 214
    - 215
    question_codes:
    - 05181
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 最大荷重が同じ二つの履歴ループで、囲まれた面積が大きいものについて、正しい結論はどちらか。
    choices:
      A: 初期剛性の大小を直接表す
      B: 1サイクルの吸収エネルギーが大きい
    correct: B
  display_content:
    definition: 荷重-変形履歴曲線の閉じたループの面積は、その1サイクルで吸収・消費するエネルギーを表す。面積そのものが最大耐力や初期剛性を表すわけではない。
    distinguishing_conditions:
    - 同じ単位・尺度の荷重-変形グラフ
    - 同じ振幅等の条件で履歴特性を比較する
    confusable_points:
    - 面積は初期剛性の大小を直接表すものではない。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-BRACE-SHARE-SEISMIC-STRESS-AMPLIFICATION
  order: 3
  type: rule
  display_content:
    rule: ラーメン・筋かい併用架構で筋かい水平力分担率βが5/7以上なら地震時応力を1.5倍、5/7未満なら1+0.7β倍に割り増す。
    applicability:
    - ラーメン架構と筋かい架構の併用
    - βは筋かいの水平力分担率
    numbers_exceptions:
    - ラーメン・筋かい併用架構で筋かい水平力分担率βが5/7以上なら地震時応力を1.5倍、5/7未満なら1+0.7β倍に割り増す。
  principle: 筋かい水平力分担率による地震時応力割増し
  question:
    prompt: ラーメン・筋かい併用架構で筋かい水平力分担率βが5/7を上回る場合、地震時応力の割増し方法として正しい結論はどちらか。
    choices:
      A: 1+0.7β倍に割り増す
      B: 1.5倍に割り増す
    correct: B
  conclusion: ラーメン・筋かい併用架構で筋かい水平力分担率βが5/7以上なら地震時応力を1.5倍、5/7未満なら1+0.7β倍に割り増す。
  reason: 筋かい強度が全体の約70%以上になると筋かいの履歴特性が架構全体へ強く現れ、5/7未満との間で耐震性能を不連続にしないため。
  conditions:
  - ラーメン架構と筋かい架構の併用
  - βは筋かいの水平力分担率
  source:
    pages:
    - 215
    question_codes:
    - 05181
  prerequisites: []
  editorial_status: source_checked
