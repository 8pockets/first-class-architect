- id: S-K6-HIGH-STRENGTH-BOLT-TENSILE-STRENGTH-RATIO
  order: 6
  type: rule
  principle: 高力ボルトと普通ボルトの引張強度
  conclusion: 高力ボルトの引張強度は、普通ボルトの2〜3倍である。
  reason: 教材に記載なし
  conditions:
