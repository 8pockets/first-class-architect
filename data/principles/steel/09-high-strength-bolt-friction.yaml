- id: S-K6-HIGH-STRENGTH-BOLT-CONSTRUCTION-ADVANTAGE
  order: 4
  type: principle
  principle: 高力ボルト接合の施工性
  conclusion: 高力ボルト接合は施工が比較的容易で、工期を短縮できる。
  reason: 教材に記載なし
  conditions:
  - 教材が説明する一般的な高力ボルト接合
  source:
    pages:
