version: 1
section:
  id: K6-04
  title: 接合・補強材の概要
  order: 5
principles:
- id: S-K6-FRICTION-JOINT-PRE-SLIP-FORCE-TRANSFER
  order: 1
  type: principle
  principle: 高力ボルト摩擦接合のすべり前の伝力機構
  question:
    prompt: 高力ボルト摩擦接合ですべりが生じる前の応力伝達について、正しい結論はどちらか。
    choices:
      A: 締付け力による接触面の摩擦で伝える
      B: ボルト軸部のせん断と母材支圧で伝える
    correct: A
  conclusion: すべりが生じるまでは、締付け力による接触面の摩擦で応力を伝え、ボルト軸部のせん断や母材支圧には期待しない。
  reason: ボルト締付け力が接合面を圧着し、材間の摩擦力が外力に抵抗するため。
  conditions:
  - 高力ボルト摩擦接合
  - すべり発生前
  - 高力ボルト摩擦接合の通常の応力伝達
  - 破断耐力の検討は別扱い
  source:
    pages:
    - 160
    - 179
    - 184
    question_codes:
    - '02163'
    - '06163'
    - '07163'
    - '18172'
    - '27181'
    - '30171'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-FRICTION-SURFACE-PREPARATION
  order: 2
  type: rule
  display_content:
    rule: 摩擦面は黒皮・塗料・油・塵埃を除去し、浮き錆ではない赤錆程度に処理する。
    applicability:
    - 通常の高力ボルト摩擦接合面
    - 高力ボルト摩擦接合の摩擦面
    numbers_exceptions:
    - 所定のすべり係数0.45を確保する。
  principle: 摩擦接合面の表面状態
  question:
    prompt: 通常の高力ボルト摩擦接合で、摩擦面の表面状態について、正しい結論はどちらか。
    choices:
      A: 黒皮・塗料・油・塵埃を除去する
      B: 黒皮・塗料・油・塵埃を残す
    correct: A
  conclusion: 摩擦面は黒皮・塗料・油・塵埃を除去し、浮き錆ではない赤錆程度に処理する。
  reason: 所定のすべり係数0.45を確保するため。
  conditions:
  - 通常の高力ボルト摩擦接合面
  - 高力ボルト摩擦接合の摩擦面
  source:
    pages:
    - 161
    - 179
    - 184
    question_codes:
    - '02163'
    - '06163'
    - '07163'
    - '18172'
    - '19252'
    - '27181'
    - '30171'
  prerequisites:
  - S-K6-FRICTION-JOINT-PRE-SLIP-FORCE-TRANSFER
  editorial_status: source_checked
- id: S-K6-PARTIAL-PENETRATION-WELD-APPLICABILITY
  order: 3
  type: rule
  principle: 部分溶込み溶接を用いてよい応力状態
  conclusion: 部分溶込み溶接は、溶接線直角方向の引張、溶接線を軸とする曲げ、又は繰返し荷重を受ける部分には用いない。せん断力を伝える場合も、応力状態と必要耐力を確認する。
  reason: 教材に記載なし
  conditions:
  - 建築鉄骨の部分溶込み溶接
  - 溶接線に対する応力方向と荷重履歴を確認する
  source:
    pages:
    - 162
    - 179
    - 187
    - 189
    question_codes:
    - '05161'
    - '22172'
    - '24171'
  prerequisites:
  - S-K6-WELD-TYPE-IDENTIFICATION
  editorial_status: source_checked
  question:
    prompt: 静的なせん断力だけを伝える接合と、溶接線に直交する引張力を伝える接合を比べ、部分溶込み溶接を検討できる側について、正しい結論はどちらか。
    choices:
      A: 溶接線直角方向の引張力を伝える側
      B: 静的なせん断力だけを伝える側
    correct: B
  display_content:
    rule: 部分溶込み溶接は、溶接線直角方向の引張、溶接線を軸とする曲げ、又は繰返し荷重を受ける部分には用いない。せん断力を伝える場合も、応力状態と必要耐力を確認する。
    applicability:
    - 建築鉄骨の部分溶込み溶接
    - 溶接線に対する応力方向と荷重履歴を確認する
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-SQUARE-TUBE-COLUMN-DIAPHRAGM-TYPES
  order: 4
  type: identification
  display_content:
    definition: 梁が取り付く柱部分には仕口剛性を高めるダイアフラムを設け、角形鋼管柱の形式は外ダイアフラム、通しダイアフラム、内ダイアフラムの3種類である。
    distinguishing_conditions:
    - 角形鋼管柱と梁の仕口
    - 柱梁接合部の図を識別する場合
    confusable_points:
    - 「仕口剛性を低くする」とは区別する。
  principle: 柱梁仕口のダイアフラムの役割と形式
  question:
    prompt: 角形鋼管柱と梁の仕口に設けるダイアフラムの役割について、正しい結論はどちらか。
    choices:
      A: 仕口剛性を低くする
      B: 仕口剛性を高める
    correct: B
  conclusion: 梁が取り付く柱部分には仕口剛性を高めるダイアフラムを設け、角形鋼管柱の形式は外ダイアフラム、通しダイアフラム、内ダイアフラムの3種類である。
  reason: 梁から伝わる力による柱板厚方向の局部変形を抑え、仕口の剛性を確保するため。
  conditions:
  - 角形鋼管柱と梁の仕口
  - 柱梁接合部の図を識別する場合
  source:
    pages:
    - 168
    - 179
    - 198
    - 209
    question_codes:
    - '01171'
    - '19151'
    - '24174'
    - '25181'
    - '28152'
    - '29182'
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
- id: S-K6-GUSSET-PLATE-MEMBER-CONNECTION
  order: 5
  type: identification
  display_content:
    definition: ガセットプレートは、柱梁の隅角部やトラス節点などに集まる部材を接合するための鋼板である。
    distinguishing_conditions:
    - ブレース納まり・トラス節点など複数部材の接合部
    - 柱と筋かい、またはトラス部材などが一点付近へ集まる接合部
    confusable_points:
    - 「集まる部材を接合せず個別に支持する」とは区別する。
  principle: ガセットプレートの用途
  question:
    prompt: 柱梁の隅角部やトラス節点に用いるガセットプレートの用途について、正しい結論はどちらか。
    choices:
      A: 集まる部材を接合せず個別に支持する
      B: 集まる部材を一枚の鋼板で接合する
    correct: B
  conclusion: ガセットプレートは、柱梁の隅角部やトラス節点などに集まる部材を接合するための鋼板である。
  reason: 集まる部材同士を一つの接合板で結ぶため。
  conditions:
  - ブレース納まり・トラス節点など複数部材の接合部
  - 柱と筋かい、またはトラス部材などが一点付近へ集まる接合部
  source:
    pages:
    - 179
    - 199
    question_codes: []
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
- id: S-K6-WELD-NO-SECTION-LOSS-HIGH-RIGIDITY
  order: 6
  type: principle
  principle: 溶接接合の断面欠損と剛性
  conclusion: 溶接だけで接合する部分ではボルト孔による母材の断面欠損がなく、部材の連続性を確保しやすい。接合部の剛性が常に他形式より最大になるとは限らない。
  reason: ボルト軸を通す孔を設けずに、溶着金属で母材同士を連続して接合するため。
  conditions:
  - ボルト孔を設けない溶接継手と孔を設けるボルト継手の比較
  - スカラップ等の切欠きや溶接欠陥は別に検討する
  source:
    pages:
    - 179
    - 187
    question_codes: []
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
  question:
    prompt: 同じ引張材の継手を、ボルト孔を設けない溶接だけで構成したとき、有効断面の検討について、正しい結論はどちらか。
    choices:
      A: ボルト孔分の断面控除は生じない
      B: ボルト孔分と同じ断面控除を行う
    correct: A
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-WELD-TYPE-IDENTIFICATION
  order: 7
  type: identification
  principle: 溶接接合の種類
  conclusion: 建築鉄骨の溶接では、接合部全厚まで溶け込ませる完全溶込み、母材の隅角部に盛るすみ肉、全厚まで溶け込ませない部分溶込みを区別する。
  reason: 教材に記載なし
  conditions:
  - 継手の外形だけでなく溶込み範囲を識別する場合
  source:
    pages:
    - 179
    - 187
    question_codes:
    - '24171'
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
  question:
    prompt: 母材の接合部全厚までは溶け込ませない開先溶接の分類について、正しい結論はどちらか。
    choices:
      A: 完全溶込み溶接
      B: 部分溶込み溶接
    correct: B
  display_content:
    definition: 建築鉄骨の溶接では、接合部全厚まで溶け込ませる完全溶込み、母材の隅角部に盛るすみ肉、全厚まで溶け込ませない部分溶込みを区別する。
    distinguishing_conditions:
    - 継手の外形だけでなく溶込み範囲を識別する場合
    confusable_points:
    - 本問では「完全溶込み溶接」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
