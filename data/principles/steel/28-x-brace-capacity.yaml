version: 1
section:
  id: K6-28
  title: X形筋かいの保有水平耐力
  order: 29
principles:
- id: S-K6-BRACE-TENSION-YIELD-COMPRESSION-BUCKLING
  order: 1
  type: principle
  principle: ブレースの引張降伏と圧縮座屈
  question:
    prompt: 細長比が大きい鉄骨造ブレースについて、圧縮側の耐力を引張降伏耐力と比べた結論として正しい結論はどちらか。
    choices:
      A: 圧縮側の耐力は引張降伏耐力より大きい
      B: 圧縮側の耐力は引張降伏耐力より小さい
    correct: B
  conclusion: ブレースは一般に引張側で降伏耐力を発揮するが、圧縮側は座屈耐力を考慮して算定し、耐力は引張降伏耐力より低下する。特に細長比が大きいと圧縮側は降伏耐力を発揮できない。
  reason: 圧縮ブレースは材料が降伏する前に全体座屈しやすく、細長比が大きいほど座屈耐力が小さく、座屈後は架構のエネルギー吸収能力も低下するため。
  conditions:
  - 鉄骨造ブレース
  - 引張側と圧縮側を比較
  - 細長比の大小を考慮
  - 細長比が大きい筋かい
  source:
    pages:
    - 170
    - 203
    - 214
    question_codes:
    - 05181
    - '21184'
    - '26153'
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
- id: S-K6-BRACED-FRAME-COLUMN-BRACE-CAPACITY-SUM
  order: 2
  type: rule
  principle: 筋かい付き骨組の柱・筋かい耐力の合算
  conclusion: 筋かい付き骨組の保有水平耐力は、柱と筋かいが負担する水平せん断耐力を合計して算定する。
  reason: 教材P170及びP200〜204を再確認したが、柱の水平せん断耐力と筋かいの水平せん断耐力を合算する根拠を確認できない。
  conditions:
  - 筋かい付き骨組の終局時・保有水平耐力を算定する場合
  source:
    pages:
    - 203
    question_codes: []
  prerequisites: []
  editorial_status: source_gap
- id: S-K6-X-BRACE-TENSION-COMPRESSION-CAPACITY
  order: 102
  type: rule
  display_content:
    rule: X形筋かいで圧縮側を考慮する場合は、一対の耐力を圧縮筋かい座屈時水平力の2倍とする方法、または引張側耐力と圧縮側座屈後安定耐力を合算する方法がある。引張側だけを期待する場合は引張降伏耐力の水平成分とする。
    applicability:
    - X形筋かい付き骨組
    - 終局時・保有水平耐力の算定
    - 圧縮側を考慮するか引張側だけを期待するかを区別
    - 圧縮側の座屈後安定耐力を評価
    numbers_exceptions:
    - X形筋かいで圧縮側を考慮する場合は、一対の耐力を圧縮筋かい座屈時水平力の2倍とする方法、または引張側耐力と圧縮側座屈後安定耐力を合算する方法がある。
    - 引張側だけを期待する場合は引張降伏耐力の水平成分とする。
  principle: X形筋かいの引張側・圧縮側耐力の合算
  question:
    prompt: 圧縮側の座屈後安定耐力を評価するX形筋かい付き骨組について、筋かいの終局時耐力の算定方法として正しい結論はどちらか。
    choices:
      A: 引張側耐力から圧縮側座屈後安定耐力を差し引く。
      B: 引張側耐力に圧縮側座屈後安定耐力を加える。
    correct: B
  conclusion: X形筋かいで圧縮側を考慮する場合は、一対の耐力を圧縮筋かい座屈時水平力の2倍とする方法、または引張側耐力と圧縮側座屈後安定耐力を合算する方法がある。引張側だけを期待する場合は引張降伏耐力の水平成分とする。
  reason: 圧縮筋かいは座屈後も安定耐力を残すため、終局時には引張側と圧縮側の寄与を組み合わせられる。
  conditions:
  - X形筋かい付き骨組
  - 終局時・保有水平耐力の算定
  - 圧縮側を考慮するか引張側だけを期待するかを区別
  - 圧縮側の座屈後安定耐力を評価
  source:
