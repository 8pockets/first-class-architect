  order: 39
  type: principle
  principle: 根巻き柱脚の曲げ・せん断分布
  conclusion: 鉄骨柱の曲げモーメントは根巻きRC頂部で最大となりベースプレートへ向かって小さくなる。根巻き部のせん断力Q2は上部鉄骨柱のQ1より大きい。
  reason: 根巻きRCと露出柱脚部分も曲げを分担し、根巻き頂部からベースプレートまでの距離が反曲点から頂部までより短いため。
