- id: S-K6-BUILT-UP-COLUMN-NON-SOLID-AXIS-SLENDERNESS-INCREASE
  order: 30
  type: principle
  principle: 組立圧縮材の非充腹軸座屈
  conclusion: 組立圧縮材の非充腹軸では細長比を割増して算定し、単一圧縮材として扱う場合より座屈荷重を小さく評価する。
  reason: 両弦材をつなぐ組立材のせん断変形により、全断面が完全に一体で働かないため。
  conditions:
  - 組立圧縮材
  - 非充腹軸まわりの座屈
