  conclusion: 柱継手は存在応力を伝えられるだけでなく、存在応力が小さくても柱断面の許容耐力の1/2以上の耐力を確保する。
  reason: 骨組計算では柱を1本の連続材として扱うため、継手にも材の連続性を保証する最低耐力が必要になる。
