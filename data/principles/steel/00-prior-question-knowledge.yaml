  order: 34
  type: identification
  principle: 伸び能力のあるアンカーボルト
  conclusion: ABR（転造ねじ）・ABM（切削ねじ）は、ねじ部破断に先立ち軸部全断面が降伏・塑性変形する伸び能力を持つ。
  reason: 降伏比の上限を規定し、ねじ部より先に軸部が降伏するようにしているため。
