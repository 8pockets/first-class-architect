- id: S-K6-ANCHOR-BOLT-RESISTANCE-TYPES
  order: 36
  type: identification
  principle: アンカーボルトの引張支持抵抗形式
  conclusion: アンカーボルトは支圧抵抗型と付着抵抗型に分類される。前者は棒表面付着と先端支圧、後者は接着剤とボルト・穿孔面の固着で抵抗する。
  reason: 引張力を基礎コンクリートへ伝える抵抗機構が異なるため。
