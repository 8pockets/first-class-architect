  conclusion: 柱梁接合部の鋼製エンドタブは、柱梁フランジ母材へ直接組立溶接せず、裏当て金へ取り付ける。
  reason: エンドタブの組立溶接はショートビードとなりやすく、母材熱影響部の破壊靭性を低下させ、フランジ脆性破壊の起点になり得るため。
