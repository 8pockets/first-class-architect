      A: 低温割れはパス間温度の上限、強度低下は予熱温度の下限で防ぐ。
      B: 低温割れは予熱温度の下限、強度低下はパス間温度の上限で防ぐ。
    correct: B
  conclusion: 低温割れ防止は溶接開始時温度の下限を守る予熱管理で行い、強度低下防止はパス間温度の上限を守る管理で行う。
  reason: 前者は急冷・硬化を防ぎ、後者は過大な熱履歴を防ぐ、異なる目的の管理だから。
  conditions:
