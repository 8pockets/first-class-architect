  conclusion: 高張力鋼で長期応力から梁断面を決めるときは、強度を満たしても鉛直たわみが大きくならないよう確認する。
  reason: 高強度化で小断面を選べてもヤング係数は大きくならず、断面剛性が小さいとたわみが増えるため。
