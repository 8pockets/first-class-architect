  conclusion: ベースプレート寸法をRC柱断面、引張側アンカーボルトを鉄筋とみなして許容応力度設計する。
  reason: 引張側アンカーボルトと圧縮側コンクリートで曲げに抵抗する機構をRC断面として表現できるため。
