  editorial_status: source_checked
- id: S-K6-METAL-TOUCH-SPLICE-DIRECT-TRANSFER-FRACTIONS
  order: 31
  type: rule
  principle: メタルタッチ継手の直接伝達分
  conclusion: 引張応力のおそれがなく端面を密着させる柱継手では、圧縮力・曲げモーメントの各1/4までを接触面から直接伝達するとみなせる。柱脚では1/2までである。
  reason: 教材に記載なし
  conditions:
