  order: 38
  type: rule
  principle: 露出柱脚の保有耐力接合とDs割増し
  conclusion: 伸び能力のあるアンカーボルトを用いても保有耐力接合条件を満たさない場合は、1階のDsを0.05割増しして保有水平耐力を確認する。条件を満たせば割増し不要である。
