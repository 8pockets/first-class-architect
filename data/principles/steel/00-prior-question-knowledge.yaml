- id: S-K6-EMBEDDED-BASE-FORCE-TRANSFER
  order: 37
  type: principle
  principle: 埋込み柱脚の応力伝達
  conclusion: 曲げモーメントとせん断力は埋込み部の上部・下部のコンクリート支圧で伝え、軸力はベースプレートから下部構造へ直接伝える。
  reason: 埋込み鉄骨と周囲コンクリートの接触支圧が偶力とせん断抵抗を形成するため。
