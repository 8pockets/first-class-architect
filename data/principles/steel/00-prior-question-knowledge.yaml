  title: 本試験知識（横断）
  order: 1
principles:
- id: S-K6-DISSIMILAR-STEEL-WELD-WEAKER-BASE-GOVERNS
  order: 1
  type: rule
  principle: 異種鋼材の突合せ溶接の許容応力度
  conclusion: 異なる種類・品質の鋼材を溶接する場合、溶接部の基準強度には接合鋼材の基準強度のうち小さい値を用いる。
  reason: 教材に記載なし
  conditions:
  - 異種鋼材の突合せ溶接
  source:
    pages:
    - 159
    question_codes:
    - '01172'
    - '06161'
    authoritative_sources:
    - kind: professional_body
      title: 建築鉄骨構造技術支援協会 鉄骨Q&A 4-23
      locator: 1.設計について／異強度材の溶接部に用いる基準強度（2026-10-06閲覧）
      url: https://sasst.jp/qa/q4/q4-23.html
      supports:
      - statement
      - explanation
      - conditions
  prerequisites: []
  related:
  - S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
  display_content:
    rule: 異なる種類・品質の鋼材を溶接する場合、溶接部の基準強度には接合鋼材の基準強度のうち小さい値を用いる。
    applicability:
    - 異種鋼材の溶接部
    - 母材に適合する溶接材料・施工条件を用いる
    numbers_exceptions:
    - 溶接材料を高強度にしても、弱い側の母材に対応する基準強度を超えて扱わない。
  question:
    prompt: 基準強度235N/mm²と325N/mm²の鋼材を適切な材料で突合せ溶接する。溶接部に用いる基準強度について、正しい結論はどちらか。
    choices:
      A: 235N/mm²を用いる
      B: 325N/mm²を用いる
    correct: A
- id: S-K6-FRAME-H-SECTION-AXIS-ROLE
  order: 2
  type: principle
  principle: H形断面柱の強軸・弱軸と架構形式
  question:
    prompt: H形断面柱で強軸方向と弱軸方向に異なる架構形式を採用できる場合、一般的な組合せとして正しい結論はどちらか。
    choices:
      A: 強軸方向をブレース構造、弱軸方向をラーメン構造とする。
      B: 強軸方向をラーメン構造、弱軸方向をブレース構造とする。
    correct: B
  conclusion: H形断面柱は、強軸方向をラーメン構造、弱軸方向をブレース構造とすることが多い。
  reason: 強軸は断面二次モーメントが大きく曲げを負担しやすく、弱軸方向はブレースで水平力に抵抗できるため。
  conditions:
  - H形断面柱を用いる鉄骨造
  - 長辺・短辺で異なる架構形式を採用できる場合
  source:
    pages:
    - 159
    question_codes:
    - '27151'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-WELD-THROAT-ALLOWABLE-SHEAR-INDEPENDENT-OF-JOINT-FORM
  order: 3
  type: rule
  display_content:
    rule: 同じ基準強度なら、完全溶込み・部分溶込み・すみ肉の各溶接で、のど断面の許容せん断応力度は等しい。長期はF/(1.5√3)、短期はF/√3である。
    applicability:
    - 接合される鋼材の基準強度Fが同じ
    - のど断面のせん断
    numbers_exceptions:
    - 長期はF/(1.5√3)、短期はF/√3である。
  principle: 溶接継目の形式と許容せん断応力度
  question:
    prompt: 接合鋼材の基準強度Fが同じとき、完全溶込み・部分溶込み・すみ肉溶接ののど断面について、正しい結論はどちらか。
    choices:
      A: 溶接形式によらず許容せん断応力度は等しい。
      B: 溶接形式によって許容せん断応力度は異なる。
    correct: A
  conclusion: 同じ基準強度なら、完全溶込み・部分溶込み・すみ肉の各溶接で、のど断面の許容せん断応力度は等しい。長期はF/(1.5√3)、短期はF/√3である。
  reason: 各形式とも、せん断に対するのど断面の許容応力度が同じ式で定められるため。
  conditions:
  - 接合される鋼材の基準強度Fが同じ
  - のど断面のせん断
  source:
    pages:
    - 159
    question_codes:
    - '03163'
    - '07161'
    - '19153'
    - '20183'
    - '26164'
    - '30152'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-ORDINARY-BOLTS-PROHIBITED-FOR-REPEATED-LOAD
  order: 4
  type: rule
  display_content:
    rule: クレーン走行桁など振動・衝撃・繰返し応力を受ける接合部には、普通ボルトを使用しない。
    applicability:
    - 振動・衝撃又は繰返し応力を受ける部材接合部
    numbers_exceptions: []
  principle: 振動・衝撃・繰返し応力部のボルト選定
  question:
    prompt: クレーン走行桁など、振動・衝撃又は繰返し応力を受ける接合部のボルト選定として、正しい結論はどちらか。
    choices:
      A: 普通ボルトを使用してよい。
      B: 普通ボルトを使用しない。
    correct: B
  conclusion: クレーン走行桁など振動・衝撃・繰返し応力を受ける接合部には、普通ボルトを使用しない。
  reason: 普通ボルトは繰返し応力を受ける接合に適さないため。
  conditions:
  - 振動・衝撃又は繰返し応力を受ける部材接合部
  source:
    pages:
    - 160
    question_codes:
    - '25171'
  prerequisites:
  - S-K6-ORDINARY-BOLT-SHEAR-TRANSFER
  editorial_status: source_checked
- id: S-K6-ALUMINUM-FRICTION-JOINT-GALVANIZED-BOLTS
  order: 5
  type: rule
  display_content:
    rule: アルミニウム合金材の摩擦接合には、一般に溶融亜鉛めっき高力ボルトを用いる。
    applicability:
    - アルミニウム合金材の摩擦接合
    numbers_exceptions: []
  principle: アルミニウム合金材の高力ボルト選定
  question:
    prompt: アルミニウム合金材を摩擦接合する場合、一般的に用いる高力ボルトとして、正しい結論はどちらか。
    choices:
      A: めっきのない高力ボルトを用いる。
      B: 溶融亜鉛めっき高力ボルトを用いる。
    correct: B
  conclusion: アルミニウム合金材の摩擦接合には、一般に溶融亜鉛めっき高力ボルトを用いる。
  reason: 接触腐食を防ぐため。
  conditions:
  - アルミニウム合金材の摩擦接合
  source:
    pages:
    - 161
    question_codes:
    - '23291'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-F14T-CLAMPING-FORCE-REDUCES-BOLT-COUNT
  order: 6
  type: principle
  principle: F14T級超高力ボルトと接合部の小型化
  question:
    prompt: 適用可能な高力ボルト接合でF10TをF14T級へ変更した場合、接合部への影響として、正しい結論はどちらか。
    choices:
      A: 必要ボルト本数が増え、接合部は大型化する。
      B: 必要ボルト本数を減らし、接合部を小型化できる。
    correct: B
  conclusion: F10Tの代わりにF14T級超高力ボルトを用いると、必要ボルト本数を減らし、スプライスプレートを小さくできる。
  reason: F14Tは遅れ破壊抵抗が高く、1本当たりの締付け力を大きくできるため。
  conditions:
  - F14T級の適用が可能な高力ボルト接合
  source:
    pages:
    - 161
    question_codes:
    - '28161'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-PARTIAL-PENETRATION-EFFECTIVE-THROAT-DEDUCTION
  order: 7
  type: rule
  display_content:
    rule: 被覆アーク溶接で開先角度60度未満のレ形・K形・V形・X形部分溶込み溶接は、有効のど厚を開先深さから3mm減じる。
    applicability:
    - 被覆アーク溶接
    - 開先角度60度未満
    - 部分溶込み溶接
    numbers_exceptions:
    - 被覆アーク溶接で開先角度60度未満のレ形・K形・V形・X形部分溶込み溶接は、有効のど厚を開先深さから3mm減じる。
  principle: 部分溶込み溶接の有効のど厚
  question:
    prompt: 被覆アーク溶接で開先角度60度未満のレ形・K形・V形・X形部分溶込み溶接について、正しい結論はどちらか。
    choices:
      A: 有効のど厚は開先深さそのものとする。
      B: 有効のど厚は開先深さから3mm減じる。
    correct: B
  conclusion: 被覆アーク溶接で開先角度60度未満のレ形・K形・V形・X形部分溶込み溶接は、有効のど厚を開先深さから3mm減じる。
  reason: 開先底部まで十分な溶込みを期待できないため。
  conditions:
  - 被覆アーク溶接
  - 開先角度60度未満
  - 部分溶込み溶接
  source:
    pages:
    - 162
    question_codes:
    - '24171'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-BEAM-END-MOMENT-STRENGTH-FLANGE-PLUS-WEB
  order: 8
  type: rule
  principle: 梁端接合部の最大曲げ耐力の構成
  conclusion: 角形鋼管柱とH形鋼梁の梁端接合部の最大曲げ耐力は、フランジ接合部とウェブ接合部の曲げ耐力の寄与を加算する。
  reason: 教材に記載なし
  conditions:
  - 角形鋼管柱とH形鋼梁の梁端接合部
  source:
    pages:
    - 163
    question_codes:
    - '03164'
  prerequisites: []
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
  display_content:
    rule: 角形鋼管柱とH形鋼梁の梁端接合部の最大曲げ耐力は、フランジ接合部とウェブ接合部の曲げ耐力の寄与を加算する。
    applicability:
    - 角形鋼管柱とH形鋼梁の梁端接合部
    - 各寄与に断面欠損・鋼管面外変形の影響を適切に考慮
    numbers_exceptions:
    - 完全溶込み溶接でもスカラップや鋼管フランジの面外変形を無視しない。
  question:
    prompt: 角形鋼管柱とH形鋼梁の接合で、影響を考慮したフランジ・ウェブの曲げ耐力の寄与がそれぞれ180kN·m、40kN·mのとき、最大曲げ耐力について正しい結論はどちらか。
    choices:
      A: 180kN·mとしてウェブの寄与を除く
      B: 220kN·mとしてウェブの寄与を含める
    correct: B
- id: S-K6-BEAM-END-STRENGTH-SECTION-LOSS-AND-TUBE-DEFORMATION
  order: 9
  type: principle
  principle: 角形鋼管柱・H形鋼梁仕口の梁端最大耐力
  question:
    prompt: 角形鋼管柱とH形鋼梁の仕口で、フランジ・ウェブを完全溶込み溶接した場合の梁端最大耐力について、正しい結論はどちらか。
    choices:
      A: 鋼管フランジの面外変形とスカラップ等の断面欠損を考慮する。
      B: 完全溶込み溶接なら、面外変形と断面欠損を考慮しない。
    correct: A
  conclusion: 梁端最大耐力は、フランジ・ウェブを完全溶込み溶接しても、鋼管フランジの面外変形とスカラップ等の断面欠損を考慮して算定する。
  reason: 梁端の耐力は溶接部だけでなく、柱側鋼管フランジの変形と梁ウェブの有効断面にも制約されるため。
  conditions:
  - 角形鋼管柱とH形鋼梁の仕口
  - 梁端最大耐力の算定
  source:
    pages:
    - 163
    question_codes:
    - '03164'
    - '25182'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-EXISTING-RIVET-JOINT-WELDED-EXTENSION-LOAD-SHARING
  order: 10
  type: rule
  principle: リベット既存継手を溶接補強する増築時の応力分担
  conclusion: 既存のリベット継手の周囲を溶接補強する増築では、既存固定荷重をリベットに残し、増築分の固定荷重・積載荷重による応力を追加溶接へ負担させる設計ができる。
  reason: 教材に記載なし
  conditions:
  - リベット継手を持つ既存建築物への増築
  - 既存継手周囲を溶接補強
  source:
    pages:
    - 163
    question_codes:
    - '18182'
  prerequisites: []
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
  display_content:
    rule: 既存のリベット継手の周囲を溶接補強する増築では、既存固定荷重をリベットに残し、増築分の固定荷重・積載荷重による応力を追加溶接へ負担させる設計ができる。
    applicability:
    - 既存の固定荷重がリベット継手に作用している状態で周囲を溶接補強する
    - 増築で新たに加わる荷重の応力を区別する
    numbers_exceptions:
    - 荷重の導入順序を無視して既存固定荷重まで追加溶接へ移したと扱わない。
  question:
    prompt: 既存固定荷重が作用するリベット継手の周囲を溶接補強して増築する。既存固定荷重による応力の扱いとして、正しい結論はどちらか。
    choices:
      A: 追加溶接だけが負担するとして設計できる
      B: 既存リベットが負担するとして設計できる
    correct: B
- id: S-K6-NO-SCALLOP-IMPROVES-BEAM-END-DUCTILITY
  order: 11
  type: principle
  principle: スカラップと梁端の塑性変形能力
  question:
    prompt: 対応可能な材料・溶接施工を用いる梁端で、ノンスカラップ工法又はひずみを緩和する形状について、正しい結論はどちらか。
    choices:
      A: 梁端の塑性変形能力を向上させる。
      B: 梁端の塑性変形能力を低下させる。
    correct: A
  conclusion: 梁ウェブのスカラップ底はひずみが集中しやすいため、ノンスカラップ工法又はひずみを緩和する形状にすると塑性変形能力の向上を期待できる。
  reason: 従来は溶接線交差による欠陥・多重入熱を避けるためスカラップを設けたが、現在は鋼材・溶接技術の向上で交差部欠陥を抑えやすく、断面欠損とひずみ集中を避けられるため。
  conditions:
  - 柱梁接合部の梁端
  - 使用材料・溶接施工がノンスカラップに対応
  source:
    pages:
    - 163
    question_codes:
    - 04182
    - '18183'
    - '25183'
    - '26162'
    - '30153'
  prerequisites:
  - S-K6-WELD-SCALLOP-DEFINITION
  editorial_status: source_checked
- id: S-K6-WELD-NDT-INTERNAL-VS-SURFACE-DEFECTS
  order: 12
  type: identification
  display_content:
    definition: 完全溶込み溶接の内部欠陥は超音波探傷で検査する。浸透探傷は表面開口欠陥だけを検出でき、磁粉探傷を内部欠陥検出に用いるとはしない。
    distinguishing_conditions:
    - 完全溶込み溶接部
    - 特記がない場合
    - 内部欠陥又は表面開口欠陥
    confusable_points:
    - 「内部欠陥は浸透探傷、表面開口欠陥は超音波探傷で検出する」とは区別する。
  principle: 溶接欠陥の位置と非破壊試験
  question:
    prompt: 特記がない完全溶込み溶接部で、内部欠陥と表面開口欠陥に用いる試験方法の組合せとして、正しい結論はどちらか。
    choices:
      A: 内部欠陥は浸透探傷、表面開口欠陥は超音波探傷で検出する。
      B: 内部欠陥は超音波探傷、表面開口欠陥は浸透探傷で検出する。
    correct: B
  conclusion: 完全溶込み溶接の内部欠陥は超音波探傷で検査する。浸透探傷は表面開口欠陥だけを検出でき、磁粉探傷を内部欠陥検出に用いるとはしない。
  reason: 浸透探傷は毛細管現象で表面から浸透液を欠陥へ入れるため、内部だけの欠陥には到達できない。
  conditions:
  - 完全溶込み溶接部
  - 特記がない場合
  - 内部欠陥又は表面開口欠陥
  source:
    pages:
    - 163
    question_codes:
    - 施工21143
    - '22171'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-HIGHER-STRENGTH-STEEL-REDUCES-DEPTH-ONLY-STRENGTH-GOVERNS
  order: 14
  type: principle
  principle: 強度支配部材での高強度鋼による断面縮小
  question:
    prompt: 断面が曲げ強度で決まり、曲げ剛性に余裕がある梁をSN400BからSN490Bへ変更する場合、正しい結論はどちらか。
    choices:
      A: 梁せいを小さくできない。
      B: 梁せいを小さくできる。
    correct: B
  conclusion: 鋼材は材料強度が高いため断面を小さくできる。特に、たわみではなく曲げ応力度が断面を決め、曲げ剛性に余裕がある梁なら、SN400BをSN490Bへ替えて梁せいを小さくできる場合がある。
  reason: 高強度鋼は許容応力度を大きくでき、断面縮小で断面係数が下がっても応力度を許容値内に保てるため。
  conditions:
  - 高強度鋼による部材断面の縮小を検討する場合
  - 曲げ剛性に余裕がある
  - 断面が強度で決まっている
  source:
    pages:
    - 164
    - 181
    question_codes:
    - '03173'
    - '28173'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-FIRST-STAGE-BENDING-CHECK-NOT-PLASTIC-BRACING-CHECK
  order: 15
  type: principle
  principle: 一次設計の許容曲げ検討と保有耐力横補剛の区別
  question:
    prompt: 大地震時に梁端の塑性化を期待するH形鋼梁で、塑性変形能力を確認する設計として、正しい結論はどちらか。
    choices:
      A: 一次設計の許容曲げ応力度検討だけで確認する
      B: 二次設計の保有耐力横補剛検討まで確認する
    correct: B
  conclusion: 地震時に梁端が塑性化するH形鋼梁は、一次設計の許容曲げ応力度検討だけでは塑性変形能力を確認できず、二次設計で保有耐力横補剛を確認する。
  reason: 一次設計は中地震時の許容応力度を扱う一方、塑性変形能力には梁が十分変形するまで横座屈しない条件が必要なため。
  conditions:
  - 大地震時に梁端塑性化を期待
  - H形鋼梁
  source:
    pages:
    - 165
    question_codes:
    - '04154'
