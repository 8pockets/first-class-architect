version: 1
section:
  id: K6-00
  title: 本試験知識（横断）
  order: 1
principles:
- id: S-K6-DISSIMILAR-STEEL-WELD-WEAKER-BASE-GOVERNS
  order: 1
  type: rule
  principle: 異種鋼材の突合せ溶接の許容応力度
  conclusion: 強度の異なる鋼材を突合せ溶接する場合、継目の許容応力度は接合母材のうち強度が小さい側で決める。
  reason: 教材に記載なし
  conditions:
  - 異種鋼材の突合せ溶接
  source:
    pages:
    - 159
    question_codes:
    - '01172'
    - '06161'
  prerequisites:
  - S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_gap
- id: S-K6-FRAME-H-SECTION-AXIS-ROLE
  order: 2
  type: principle
  principle: H形断面柱の強軸・弱軸と架構形式
  conclusion: H形断面柱は、強軸方向をラーメン構造、弱軸方向をブレース構造とすることが多い。
  reason: 強軸は断面二次モーメントが大きく曲げを負担しやすく、弱軸方向はブレースで水平力に抵抗できるため。
  conditions:
  - H形断面柱を用いる鉄骨造
  - 長辺・短辺で異なる架構形式を採用できる場合
  source:
    pages:
    - 159
    question_codes:
    - '27151'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-WELD-THROAT-ALLOWABLE-SHEAR-INDEPENDENT-OF-JOINT-FORM
  order: 3
  type: rule
  principle: 溶接継目の形式と許容せん断応力度
  conclusion: 同じ基準強度なら、完全溶込み・部分溶込み・すみ肉の各溶接で、のど断面の許容せん断応力度は等しい。長期はF/(1.5√3)、短期はF/√3である。
  reason: 各形式とも、せん断に対するのど断面の許容応力度が同じ式で定められるため。
  conditions:
  - 接合される鋼材の基準強度Fが同じ
  - のど断面のせん断
  source:
    pages:
    - 159
    question_codes:
    - '03163'
    - '07161'
    - '19153'
    - '20183'
    - '26164'
    - '30152'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-ORDINARY-BOLTS-PROHIBITED-FOR-REPEATED-LOAD
  order: 4
  type: rule
  principle: 振動・衝撃・繰返し応力部のボルト選定
  conclusion: クレーン走行桁など振動・衝撃・繰返し応力を受ける接合部には、普通ボルトを使用しない。
  reason: 普通ボルトは繰返し応力を受ける接合に適さないため。
  conditions:
  - 振動・衝撃又は繰返し応力を受ける部材接合部
  source:
    pages:
    - 160
    question_codes:
    - '25171'
  prerequisites:
  - S-K6-ORDINARY-BOLT-SHEAR-TRANSFER
  editorial_status: source_checked
- id: S-K6-ALUMINUM-FRICTION-JOINT-GALVANIZED-BOLTS
  order: 5
  type: rule
  principle: アルミニウム合金材の高力ボルト選定
  conclusion: アルミニウム合金材の摩擦接合には、一般に溶融亜鉛めっき高力ボルトを用いる。
  reason: 接触腐食を防ぐため。
  conditions:
  - アルミニウム合金材の摩擦接合
  source:
    pages:
    - 161
    question_codes:
    - '23291'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-F14T-CLAMPING-FORCE-REDUCES-BOLT-COUNT
  order: 6
  type: principle
  principle: F14T級超高力ボルトと接合部の小型化
  conclusion: F10Tの代わりにF14T級超高力ボルトを用いると、必要ボルト本数を減らし、スプライスプレートを小さくできる。
  reason: F14Tは遅れ破壊抵抗が高く、1本当たりの締付け力を大きくできるため。
  conditions:
  - F14T級の適用が可能な高力ボルト接合
  source:
    pages:
    - 161
    question_codes:
    - '28161'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-PARTIAL-PENETRATION-EFFECTIVE-THROAT-DEDUCTION
  order: 7
  type: rule
  principle: 部分溶込み溶接の有効のど厚
  conclusion: 被覆アーク溶接で開先角度60度未満のレ形・K形・V形・X形部分溶込み溶接は、有効のど厚を開先深さから3mm減じる。
  reason: 開先底部まで十分な溶込みを期待できないため。
  conditions:
  - 被覆アーク溶接
  - 開先角度60度未満
  - 部分溶込み溶接
  source:
    pages:
    - 162
    question_codes:
    - '24171'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-BEAM-END-MOMENT-STRENGTH-FLANGE-PLUS-WEB
  order: 8
  type: rule
  principle: 梁端接合部の最大曲げ耐力の構成
  conclusion: 梁端接合部の最大曲げ耐力は、梁フランジ接合部と梁ウェブ接合部の耐力の和で算定する。
  reason: 教材に記載なし
  conditions:
  - 角形鋼管柱とH形鋼梁の梁端接合部
  source:
    pages:
    - 163
    question_codes:
    - '03164'
  prerequisites: []
  editorial_status: source_gap
- id: S-K6-BEAM-END-STRENGTH-SECTION-LOSS-AND-TUBE-DEFORMATION
  order: 9
  type: principle
  principle: 角形鋼管柱・H形鋼梁仕口の梁端最大耐力
  conclusion: 梁端最大耐力は、フランジ・ウェブを完全溶込み溶接しても、鋼管フランジの面外変形とスカラップ等の断面欠損を考慮して算定する。
  reason: 梁端の耐力は溶接部だけでなく、柱側鋼管フランジの変形と梁ウェブの有効断面にも制約されるため。
  conditions:
  - 角形鋼管柱とH形鋼梁の仕口
  - 梁端最大耐力の算定
  source:
    pages:
    - 163
    question_codes:
    - '03164'
    - '25182'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-EXISTING-RIVET-JOINT-WELDED-EXTENSION-LOAD-SHARING
  order: 10
  type: rule
  principle: リベット既存継手を溶接補強する増築時の応力分担
  conclusion: 既存リベットに既存部分の固定荷重を負担させ、追加する溶接に増築部分の固定荷重・積載荷重を負担させる併用継手として設計できる。
  reason: 教材に記載なし
  conditions:
  - リベット継手を持つ既存建築物への増築
  - 既存継手周囲を溶接補強
  source:
    pages:
    - 163
    question_codes:
    - '18182'
  prerequisites: []
  editorial_status: source_gap
- id: S-K6-NO-SCALLOP-IMPROVES-BEAM-END-DUCTILITY
  order: 11
  type: principle
  principle: スカラップと梁端の塑性変形能力
  conclusion: 梁ウェブのスカラップ底はひずみが集中しやすいため、ノンスカラップ工法又はひずみを緩和する形状にすると塑性変形能力の向上を期待できる。
  reason: 従来は溶接線交差による欠陥・多重入熱を避けるためスカラップを設けたが、現在は鋼材・溶接技術の向上で交差部欠陥を抑えやすく、断面欠損とひずみ集中を避けられるため。
  conditions:
  - 柱梁接合部の梁端
  - 使用材料・溶接施工がノンスカラップに対応
  source:
    pages:
    - 163
    question_codes:
    - 04182
    - '18183'
    - '25183'
    - '26162'
    - '30153'
  prerequisites:
  - S-K6-WELD-SCALLOP-DEFINITION
  editorial_status: source_checked
- id: S-K6-WELD-NDT-INTERNAL-VS-SURFACE-DEFECTS
  order: 12
  type: identification
  principle: 溶接欠陥の位置と非破壊試験
  conclusion: 完全溶込み溶接の内部欠陥は超音波探傷で検査する。浸透探傷は表面開口欠陥だけを検出でき、磁粉探傷を内部欠陥検出に用いるとはしない。
  reason: 浸透探傷は毛細管現象で表面から浸透液を欠陥へ入れるため、内部だけの欠陥には到達できない。
  conditions:
  - 完全溶込み溶接部
  - 特記がない場合
  - 内部欠陥又は表面開口欠陥
  source:
    pages:
    - 163
    question_codes:
    - 施工21143
    - '22171'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-COMPRESSION-ALLOWABLE-WITHOUT-BUCKLING
  order: 13
  type: principle
  principle: 座屈しない圧縮材の許容応力度
  conclusion: 座屈のおそれがない圧縮材の許容圧縮応力度は、許容引張応力度と同等の値となる。
  reason: 座屈による耐力低減を考慮する必要がないため。
  conditions:
  - 圧縮材に座屈のおそれがない
  source:
    pages:
    - 164
    question_codes:
    - '02153'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-HIGHER-STRENGTH-STEEL-REDUCES-DEPTH-ONLY-STRENGTH-GOVERNS
  order: 14
  type: principle
  principle: 強度支配梁での高強度鋼による梁せい縮小
  conclusion: たわみではなく曲げ応力度が断面を決め、曲げ剛性に余裕がある梁なら、SN400BをSN490Bへ替えて梁せいを小さくできる場合がある。
  reason: 高強度鋼は許容応力度を大きくでき、梁せい縮小で断面係数が下がっても応力度を許容値内に保てるため。
  conditions:
  - 曲げ剛性に余裕がある
  - 断面が強度で決まっている
  source:
    pages:
    - 164
    question_codes:
    - '03173'
    - '28173'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-FIRST-STAGE-BENDING-CHECK-NOT-PLASTIC-BRACING-CHECK
  order: 15
  type: principle
  principle: 一次設計の許容曲げ検討と保有耐力横補剛の区別
  conclusion: 地震時に梁端が塑性化するH形鋼梁は、一次設計の許容曲げ応力度検討だけでは塑性変形能力を確認できず、二次設計で保有耐力横補剛を確認する。
  reason: 一次設計は中地震時の許容応力度を扱う一方、塑性変形能力には梁が十分変形するまで横座屈しない条件が必要なため。
  conditions:
  - 大地震時に梁端塑性化を期待
  - H形鋼梁
  source:
    pages:
    - 165
    question_codes:
    - '04154'
  prerequisites:
  - S-K6-FULL-PLASTIC-LATERAL-BRACING-PLACEMENT-METHODS
  editorial_status: source_checked
- id: S-K6-H-BEAM-ALLOWABLE-BENDING-INPUTS
  order: 16
  type: rule
  principle: H形断面梁の許容曲げ応力度を決める要素
  conclusion: H形断面梁の許容曲げ応力度は、鋼種、断面寸法、曲げモーメント分布、圧縮フランジの支点間距離を用いて算定する。
  reason: 教材に記載なし
  conditions:
  - H形断面梁
  source:
    pages:
    - 165
    question_codes:
    - '05151'
    - '23152'
  prerequisites:
  - S-K6-19-LATERAL-BUCKLING
  editorial_status: source_gap
- id: S-K6-H-SECTION-COLUMN-WEAK-AXIS-GOVERNS-BUCKLING
  order: 17
  type: principle
  principle: H形断面圧縮材の座屈軸
  conclusion: 両端ピンのH形断面圧縮材は、通常、最小となる弱軸まわりの断面二次半径で細長比と許容圧縮応力度を求める。
  reason: 弱軸まわりの断面二次半径が小さく、同じ座屈長さで最も細長比が大きくなるため。
  conditions:
  - H形断面圧縮材
  - 両端ピン
  - 各軸の座屈長さが同じ
  source:
    pages:
    - 165
    question_codes:
    - '28172'
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
- id: S-K6-LATERAL-BRACING-ENABLES-FULL-PLASTIC-MOMENT
  order: 18
  type: principle
  principle: 横補剛と梁の全塑性モーメント
  conclusion: 圧縮側フランジの横変位を拘束する横補剛を設け、梁端が十分回転変形するまで横座屈を防ぐ。直交小梁を増やす方法もある。
  reason: 梁端が塑性状態に達する前に横座屈すると、想定した全塑性モーメントを発揮できないため。
  conditions:
  - 塑性化を期待するH形鋼梁
  source:
    pages:
    - 165
    question_codes:
    - '03172'
    - '21163'
    - '26172'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-FLOOR-HORIZONTAL-TRUSS-SECONDARY-BEAM-AXIAL-FORCE
  order: 19
  type: principle
  principle: 小梁・水平ブレース床トラスの小梁軸力
  conclusion: 床の水平せん断力を小梁と水平ブレースのトラスで伝える場合、小梁を軸力部材としても検討する。
  reason: 水平力が床トラスを通って各骨組へ流れ、小梁もトラス弦・圧縮引張材として力を負担するため。
  conditions:
  - 床スラブを剛床として期待できず、小梁と水平ブレースでトラスを形成
  source:
    pages:
    - 166
    question_codes:
    - '01151'
    - '27153'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-UNIFORM-BRACING-SLENDERNESS-FORMULAS
  order: 20
  type: rule
  principle: 均等配置横補剛の細長比条件
  conclusion: 梁全長に均等配置する場合、弱軸細長比はSN400Bでλ≤170+20n、SN490Bでλ≤130+20nを満たすよう補剛数nを決める。
  reason: 教材に記載なし
  conditions:
  - 梁全長に横補剛を均等配置
  - SN400B又はSN490B
  source:
    pages:
    - 166
    question_codes:
    - '01153'
    - 07183
  prerequisites: []
  editorial_status: source_gap
- id: S-K6-BRACE-TO-HOLLOW-COLUMN-DIAPHRAGM-REINFORCEMENT
  order: 21
  type: principle
  principle: 中空角形鋼管柱への筋かい接合補強
  conclusion: 冷間成形角形鋼管柱に筋かいを接合するときは、通し・内・外ダイアフラムなどで局部変形を防ぐ。
  reason: 筋かいの引張・圧縮力で鋼管の板要素に大きな面外曲げ変形が生じると、筋かい耐力を十分発揮できないため。
  conditions:
  - 中空断面の冷間成形角形鋼管柱へ筋かいを接合
  source:
    pages:
    - 168
    question_codes:
    - '04174'
    - '30184'
  prerequisites:
  - S-K6-SQUARE-TUBE-COLUMN-DIAPHRAGM-TYPES
  editorial_status: source_checked
- id: S-K6-FRICTION-JOINT-GAP-FILLER-RULE
  order: 22
  type: rule
  principle: 高力ボルト摩擦接合の肌すき処理
  conclusion: 肌すき1mm以下は処理不要、1mmを超える場合は両面を摩擦面処理したフィラーを挿入する。フィラー材は母材にかかわらずSN400Aでよい。
  reason: 教材に記載なし
  conditions:
  - 高力ボルト摩擦接合
  - 肌すき量が1mm以下又は1mm超
  source:
    pages:
    - 168
    question_codes:
    - '01173'
    - '03161'
    - '23172'
  prerequisites:
  - S-K6-FRICTION-SURFACE-PREPARATION
  editorial_status: source_gap
- id: S-K6-NONSEISMIC-TRUSS-JOINT-MINIMUM-STRENGTH
  order: 23
  type: rule
  principle: 地震力を受けないトラス接合部の最低耐力
  conclusion: 接合部は存在応力を伝え、かつ部材の許容耐力の1/2を上回る耐力を持たせる。
  reason: 教材に記載なし
  conditions:
  - 地震力を受けないトラス部材の接合部
  source:
    pages:
    - 169
    question_codes:
    - '18181'
  prerequisites: []
  editorial_status: source_gap
- id: S-K6-BRACE-SIDE-FILLET-WELD-FORCE-TRANSFER
  order: 24
  type: principle
  principle: 筋かいとガセットプレートの側面すみ肉溶接
  conclusion: 筋かいの軸方向力は、側面すみ肉溶接のせん断力としてガセットプレートへ伝達できる。
  reason: 溶接線に沿うすみ肉溶接が筋かい軸力をせん断で受け渡すため。
  conditions:
  - 筋かいとガセットプレートを側面すみ肉溶接
  source:
    pages:
    - 170
    question_codes:
    - '07154'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-BUCKLING-RESTRAINED-BRACE-FORCE-ROLES
  order: 25
  type: principle
  principle: 座屈拘束ブレースの芯材と拘束材の役割
  conclusion: 芯材が引張・圧縮軸力と塑性変形を負担し、周囲の座屈拘束材は芯材の座屈を防ぐ剛性・曲げ耐力を持つが軸力は負担しない。この機構により制振ダンパー・耐震部材として用いられる。
  reason: 芯材と拘束材の間をアンボンド処理して軸力を分離し、拘束材が横方向だけ支えるため。
  conditions:
  - 座屈拘束ブレース又はアンボンドブレース
  source:
    pages:
    - 170
    - 171
    question_codes:
    - '07151'
    - '21182'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-COMPRESSION-BRACE-BUCKLING-CAPACITY
  order: 26
  type: principle
  principle: 圧縮筋かいの座屈耐力
  conclusion: 圧縮力を負担する筋かいは座屈耐力を考慮して耐力を算定する。
  reason: 筋かいが座屈すると耐力が劣化し、架構のエネルギー吸収能力も低下するため。
  conditions:
  - 圧縮力を負担する筋かい
  source:
    pages:
    - 170
    question_codes:
    - '26153'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-ECCENTRIC-K-BRACE-ENERGY-DISSIPATION
  order: 27
  type: principle
  principle: 偏心K形筋かいのエネルギー吸収
  conclusion: 偏心K形筋かいを適切に設計すると、剛節骨組に類似する高いエネルギー吸収能力を得られる。
  reason: 保有耐力時まで筋かいを座屈させず、筋かい以外の部材を塑性化させてエネルギーを吸収するため。
  conditions:
  - 偏心K形筋かい付き骨組
  - リンク部等を適切に設計
  source:
    pages:
    - 170
    question_codes:
    - '22162'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-BRACE-SLENDERNESS-AND-DEFORMATION-CAPACITY
  order: 28
  type: principle
  principle: 筋かいの有効細長比と変形性能
  conclusion: 有効細長比が小さい筋かいは、中程度の筋かいより座屈しにくく、許容圧縮応力度と変形性能が高い。
  reason: λ=Lk/iが小さいほど圧縮座屈しにくいため。
  conditions:
  - 圧縮力を受ける筋かい
  - 例としてλ≈20とλ≈80の比較
  source:
    pages:
    - 171
    question_codes:
    - '02152'
    - '07152'
    - '22161'
  prerequisites:
  - S-K6-18-SLENDERNESS
  editorial_status: source_checked
- id: S-K6-WRAPPED-BASE-DUCTILE-FAILURE-MODE
  order: 29
  type: principle
  principle: 根巻き柱脚の望ましい破壊モード
  conclusion: 根巻き鉄筋コンクリートの主筋降伏による曲げ破壊を、支圧・斜め・付着ひび割れ破壊より先行させる。
  reason: 主筋降伏による曲げ破壊は変形能力があり、他の破壊モードは変形能力に乏しいため。
