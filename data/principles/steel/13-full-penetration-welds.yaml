version: 1
section:
  id: K6-13
  title: 完全溶込み溶接
  order: 14
principles:
- id: S-K6-END-TABS-SECURE-SOUND-WELD-ENDS
  order: 1
  type: principle
  principle: 完全溶込み溶接端部のエンドタブ
  conclusion: 開先溶接の両端には、健全な完全溶込み溶接断面を確保するためエンドタブを用いる。
  reason: 突合せ溶接の始点と終点での欠陥発生を避けるため。
  conditions:
  - 完全溶込み溶接
  - 開先の始端・終端
  - 突合せ溶接の始点・終点
  source:
    pages:
    - 162
    - 188
    question_codes:
    - '20185'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-STEEL-END-TAB-RETENTION-CONDITIONS
  order: 2
  type: rule
  principle: 鋼製エンドタブを切断しなくてよい接合部
  conclusion: 施工上支障がなければ、塑性ヒンジを形成しない梁端接合部、400N/mm²級梁材の接合部、又はH形断面柱との接合部では、鋼製エンドタブを原則切断しなくてよい。
  reason: 教材に記載なし
  conditions:
  - 列挙条件のいずれかに該当
  - 後工程に問題を生じない
  - 金属疲労を生じさせる荷重が作用しない
  - 応力伝達上の支障がない
  - 『すべてに該当しない』が『三条件のいずれにも該当しない』か『全条件を同時に満たさない』か、教材文だけでは判定困難
  source:
    pages:
    - 162
    - 188
    question_codes:
    - '28151'
  prerequisites:
  - S-K6-END-TABS-SECURE-SOUND-WELD-ENDS
  editorial_status: source_gap
- id: S-K6-FULL-PENETRATION-WELD-ANATOMY
  order: 3
  type: identification
  principle: 完全溶込み溶接断面の用語
  conclusion: 教材図は、開先・開先角度・ルート面・ルート間隔・溶込み深さ・有効のど厚・余盛・裏あて金を完全溶込み溶接断面の各部として示す。
  reason: 教材に記載なし
  conditions:
  - 突合せ継手またはT継手の断面図を識別する場合
  source:
    pages:
    - 188
    question_codes: []
  prerequisites:
  - S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_gap
- id: S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  order: 4
  type: identification
  principle: 完全溶込み溶接の構成と適用
  conclusion: 完全溶込み溶接は、母材端部に開先を設けて溶着金属で満たし一体化する溶接で、繰返し応力を伝達する部分に使用できる。
  reason: 教材に記載なし
  conditions:
  - 突合せ溶接（完全溶込み溶接）
  source:
    pages:
    - 188
    question_codes: []
  prerequisites:
  - S-K6-WELD-TYPE-IDENTIFICATION
  editorial_status: source_gap
- id: S-K6-FULL-PENETRATION-WELD-EFFECTIVE-LENGTH
  order: 5
  type: rule
  principle: 完全溶込み溶接の有効長さ
  conclusion: 完全溶込み溶接の有効長さは、全幅にわたり溶接するため材幅とする。
  reason: 材幅全長にわたって溶接するため。
  conditions:
  - 完全溶込み溶接
  source:
    pages:
    - 188
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-FULL-PENETRATION-WELD-EFFECTIVE-THROAT
  order: 6
  type: rule
  principle: 完全溶込み溶接の有効のど厚
  conclusion: 完全溶込み溶接の有効のど厚は、薄い方の板厚とする。
  reason: 教材に記載なし
  conditions:
  - 厚さの異なる母材を完全溶込み溶接する場合
  source:
    pages:
    - 188
    question_codes: []
  prerequisites:
  - S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_gap
- id: S-K6-WELD-BACK-GOUGING-PURPOSE
  order: 7
  type: principle
  principle: 裏はつりの目的と順序
  conclusion: 裏はつりは第一層の溶込み不足やスラグ巻込みを除去する作業で、その後に裏面から溶接する。
  reason: 第一層に残った欠陥を除去してから裏面溶接するため。
  conditions:
  - 裏面からも溶接する突合せ溶接
  source:
    pages:
    - 188
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-WELD-BACKING-BAR-ROOT-GAP
  order: 8
  type: rule
  principle: 裏あて金の役割と必要条件
  conclusion: 裏あて金は溶接部を裏側から補強する補助板で、ルート間隔が6mm以上の場合に必要である。
  reason: 強度補強のため。
  conditions:
  - ルート間隔6mm以上
  source:
    pages:
    - 188
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
