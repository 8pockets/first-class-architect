  title: 多パス溶接
  order: 37
principles:
- id: S-K6-MULTIPASS-HEAT-INPUT-INTERPASS-UPPER-CONTROL
  order: 1
  type: principle
  principle: 入熱量・パス間温度と溶接部強度
  question:
    prompt: 多パス溶接で品質を確保するため、入熱量とパス間温度の管理基準を設定する。正しい結論はどちらか。
    choices:
      A: 規定値を下限として高い側へ管理する
      B: 規定値を上限として超過を防止する
    correct: B
  conclusion: 多パス溶接では入熱量とパス間温度を規定上限以内に管理する。過大な入熱や高すぎるパス間温度は溶接部の強度・靭性低下につながる。
  reason: 溶接部の機械的性質は溶接条件の影響を受け、過大な入熱や高いパス間温度が強度低下・欠陥につながるため。
  conditions:
  - 多パス溶接
  - 強度・靭性低下を防ぐ管理
  - 次のパス直前の溶接金属および近接母材温度
  source:
    pages:
    - 174
    - 211
    question_codes:
    - 04181
    - '20184'
    - '23174'
    - '30151'
  prerequisites:
  - S-K6-WELD-METAL-COMPOSITION
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-PREHEAT-PREVENTS-LOW-TEMPERATURE-CRACKING
  order: 2
  type: principle
  principle: 予熱と低温割れ防止
  question:
    prompt: 厚板の溶接で低温割れ防止の予熱が必要となった。予熱と多パス溶接のパス間温度管理の組合せとして、正しい結論はどちらか。
    choices:
      A: 予熱は開始前、パス間温度は上限を管理する
      B: 予熱は開始前、パス間温度は下限を管理する
    correct: A
  conclusion: 低温割れのおそれがある場合は、溶接前に母材を予熱する。教材の50〜100℃程度は例であり、実際の予熱条件は溶接方法・鋼種・板厚・気温などに応じて定める。
  reason: 冷たい母材への溶接では欠陥が生じやすいため、母材を事前に温めて溶接部の低温割れを防ぐため。
  conditions:
  - 厚板や低温環境など低温割れのおそれがある場合
  - 必要な予熱温度は溶接条件ごとに定める
  - 予熱は溶接開始前に行う
  source:
    pages:
    - 175
    - 211
    question_codes:
    - '22173'
    - '28153'
    authoritative_sources:
    - kind: government_spec
      title: 公共建築工事標準仕様書（建築工事編）令和7年版
      locator: 7.6.7(1)(オ)、7.6.8（予熱・施工条件）
      url: https://www.mlit.go.jp/gobuild/content/001888816.pdf
