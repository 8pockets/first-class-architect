- id: S-K6-WELD-PASS-AND-MULTIPASS-IDENTIFICATION
  order: 3
  type: identification
  display_content:
    definition: 溶接線に沿った1回の溶接操作を1パスという。開先の断面を複数のパスで順に充填する施工が多パス溶接であり、溶接線の長さ方向に溶接部分と無溶接部分を設ける断続溶接とは区別する。
    distinguishing_conditions:
    - 開先溶接の断面を充填する操作
    - パスを重ねる施工と、長さ方向に間隔を置く施工を区別する
    confusable_points:
    - 多パスは断面を埋めるための反復であり、断続溶接のように溶接線の長さ方向の配置を表す語ではない。
  principle: 1パスと多パス溶接
  question:
    prompt: 同じ開先の断面を、ビードを順に重ねて埋める施工を指している。名称として正しい結論はどちらか。
    choices:
      A: 多パス溶接
      B: 断続すみ肉溶接
    correct: A
  conclusion: 溶接線に沿った1回の溶接操作を1パスという。開先の断面を複数のパスで順に充填する施工が多パス溶接であり、溶接線の長さ方向に溶接部分と無溶接部分を設ける断続溶接とは区別する。
  reason: 開先が大きいと1パスだけでは全断面を溶接できないため。
  conditions:
  - 開先溶接の断面を充填する操作
  - パスを重ねる施工と、長さ方向に間隔を置く施工を区別する
  source:
    pages:
    - 211
    question_codes: []
  prerequisites:
  - S-K6-MULTIPASS-HEAT-INPUT-INTERPASS-UPPER-CONTROL
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
