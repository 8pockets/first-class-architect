items:
  S-K6-DISSIMILAR-STEEL-WELD-WEAKER-BASE-GOVERNS:
    code: structure.steel.dissimilar-steel-weld-weaker-base-governs
    type: rule
    revision_history:
    - revision: 1
      state: provisional_answer
      prompt: 強度の異なる鋼材の突合せ溶接で、許容応力度を決める側について、正しい結論はどちらか。
      choices:
        A: 接合母材のうち強度が小さい側
        B: 接合母材のうち強度が大きい側
      answer: A
      details:
        rule: 強度の異なる鋼材を突合せ溶接する場合、継目の許容応力度は接合母材のうち強度が小さい側で決める。
        applicability:
        - 異種鋼材の突合せ溶接
        numbers_exceptions: []
      evidence:
      - kind: ledger
        locator: 教材 P159；問題コード 01172、06161
        supports:
        - answer
        - details
      - kind: codex
        supplement: 設問を一つの判断軸に絞り、誤答選択肢を新規作成した。Codex補足は暫定正解の根拠には用いていない。
        supports:
        - question
