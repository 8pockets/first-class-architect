version: 1
section:
  id: K6-01
  title: 鉄骨構造の全体像
  order: 2
principles:
- id: S-K6-COLUMN-BASE-TYPES-FIXITY-ORDER
  order: 1
  type: identification
  principle: 柱脚形式と固定度の大小
  conclusion: 通常の柱脚形式を概略比較すると、固定度は埋込み形式≧根巻き形式＞露出形式となる。実際の固定度は接合部の剛性に応じて評価する。
  reason: 教材に記載なし
  conditions:
  - 同程度の柱・基礎を用いた通常の柱脚形式の概略比較
  - 露出柱脚にも回転剛性があり、常に完全なピンではない
  source:
    pages:
    - 176
    - 180
    - 204
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 柱脚形式の一般的な回転拘束の大小関係について、正しい結論はどちらか。
    choices:
      A: 埋込み≧根巻き＞露出
      B: 根巻き≧露出＞埋込み
    correct: A
  display_content:
    definition: 通常の柱脚形式を概略比較すると、固定度は埋込み形式≧根巻き形式＞露出形式となる。実際の固定度は接合部の剛性に応じて評価する。
    distinguishing_conditions:
    - 同程度の柱・基礎を用いた通常の柱脚形式の概略比較
    - 露出柱脚にも回転剛性があり、常に完全なピンではない
    confusable_points:
    - 本問では「根巻き≧露出＞埋込み」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-H-SECTION-FLANGE-BENDING
  order: 2
  type: principle
  principle: H形鋼フランジの役割
  conclusion: 強軸曲げを受けるH形鋼梁では、上下フランジが曲げによる引張・圧縮の主な負担部となる。
  reason: 曲げでは中立軸から遠い部分に大きな軸方向応力が生じ、上下フランジの引張力と圧縮力が対となって曲げモーメントに抵抗するため。
  conditions:
  - H形鋼梁の強軸曲げ
  - フランジが曲げ、ウェブがせん断を主に負担する近似
  source:
    pages:
    - 176
    - 178
    - 187
    - 192
    question_codes:
    - '20172'
    - '23173'
    - '26163'
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 下向き荷重で正曲げを受けるH形鋼梁の上下フランジの応力について、正しい結論はどちらか。
    choices:
      A: 上フランジが引張、下フランジが圧縮
      B: 上フランジが圧縮、下フランジが引張
    correct: B
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-H-SECTION-WEB-SHEAR
  order: 3
  type: identification
  principle: H形鋼ウェブの役割
  conclusion: H形鋼梁の簡略計算では、フランジに曲げ、ウェブにせん断力を負担させる。
  reason: 教材に記載なし
  conditions:
  - H形鋼梁のフランジ・ウェブの役割を区別する簡略計算
  - 実際の応力分布を各部分で完全に分離するものではない
  source:
    pages:
    - 176
    - 178
    - 187
    - 192
    question_codes:
    - '20172'
    - '23173'
    - '26163'
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: H形鋼梁の継手をフランジ側とウェブ側に分けて設計するとき、主にせん断力を伝える部分について、正しい結論はどちらか。
    choices:
      A: フランジ側の継手
      B: ウェブ側の継手
    correct: B
  display_content:
    definition: H形鋼梁の簡略計算では、フランジに曲げ、ウェブにせん断力を負担させる。
    distinguishing_conditions:
    - H形鋼梁のフランジ・ウェブの役割を区別する簡略計算
    - 実際の応力分布を各部分で完全に分離するものではない
    confusable_points:
    - 本問では「フランジ側の継手」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-HIGH-STRENGTH-BOLT-CONNECTION-TYPES
  order: 4
  type: identification
  principle: 高力ボルト接合の形式
  conclusion: 高力ボルト接合には摩擦接合と引張接合があり、多くは摩擦接合である。
  reason: 教材に記載なし
  conditions:
  - 高力ボルト接合の形式を識別する場合
  source:
    pages:
    - 176
    - 179
    - 184
    question_codes: []
  prerequisites:
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  editorial_status: source_checked
  question:
    prompt: 高力ボルトを軸方向に引っ張る力を、ボルトの引張抵抗で伝える接合形式について、正しい結論はどちらか。
    choices:
      A: 摩擦接合
      B: 引張接合
    correct: B
  display_content:
    definition: 高力ボルト接合には摩擦接合と引張接合があり、多くは摩擦接合である。
    distinguishing_conditions:
    - 高力ボルト接合の形式を識別する場合
    confusable_points:
    - 本問では「摩擦接合」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  order: 5
  type: identification
  display_content:
    definition: 鋼材同士をつなぐ接合には、リベット接合・ボルト接合・高力ボルト接合・溶接接合などがある。
    distinguishing_conditions:
    - 鉄骨部材同士を接合する場合
    confusable_points:
    - 「リベット・ボルト・高力ボルトだけで、溶接は含まれない」とは区別する。
  principle: 鋼材の接合方法
  question:
    prompt: 鉄骨部材同士をつなぐ接合方法の種類について、正しい結論はどちらか。
    choices:
      A: リベット・ボルト・高力ボルトだけで、溶接は含まれない
      B: リベット・ボルト・高力ボルト・溶接などがある
    correct: B
  conclusion: 鋼材同士をつなぐ接合には、リベット接合・ボルト接合・高力ボルト接合・溶接接合などがある。
  reason: 鉄骨構造は部材を組み立てる構造で、部材同士を接合する必要があるため。
  conditions:
  - 鉄骨部材同士を接合する場合
  source:
    pages:
    - 176
    - 179
    - 183
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-STEEL-DUCTILITY-PREVENTS-BRITTLE-FRACTURE
  order: 6
  type: principle
  principle: 鋼材の靭性と破断
  question:
    prompt: 同じ強度の鋼材から、溶接部の脆性破断を防ぎ塑性変形能力を確保する材料を選ぶ。追加して確認する特性として正しい結論はどちらか。
    choices:
      A: 必要な靭性を確保すること
      B: ヤング係数を大きくすること
    correct: A
  conclusion: 必要な靭性が確保された鋼材・溶接部は、塑性変形を発揮しやすく脆性破断を起こしにくい。鋼材であることだけでは脆性破断しないとはいえない。
  reason: 靭性は破断までにエネルギーを吸収する能力に関係し、不足すると大きな変形を発揮する前に脆性破断するおそれがあるため。
  conditions:
  - 鋼材と溶接部の必要靭性が確保されていること
  - 材料強度と靭性は別の特性として評価する
  source:
    pages:
    - 176
    - 177
    - 181
    question_codes: []
    authoritative_sources:
    - kind: professional_body
      title: 日本鉄鋼連盟 鉄骨造建物の耐震・耐津波安全性と鋼材について
      locator: 冊子p.9–10（PDF6頁）「シャルピー吸収エネルギー」「溶接部のシャルピー吸収エネルギー」
      url: https://www.jisf.or.jp/business/tech/infrastructure/docs/infrastructure_pdf_02.pdf
      supports:
      - statement
      - explanation
      - conditions
  prerequisites: []
