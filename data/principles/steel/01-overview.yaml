- id: S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  order: 5
  type: identification
  display_content:
    definition: 鋼材同士をつなぐ接合には、リベット接合・ボルト接合・高力ボルト接合・溶接接合などがある。
    distinguishing_conditions:
    - 鉄骨部材同士を接合する場合
    confusable_points:
    - 「リベット・ボルト・高力ボルトだけで、溶接は含まれない」とは区別する。
  principle: 鋼材の接合方法
  question:
    prompt: 鉄骨部材同士をつなぐ接合方法の種類について、正しい結論はどちらか。
    choices:
      A: リベット・ボルト・高力ボルトだけで、溶接は含まれない
      B: リベット・ボルト・高力ボルト・溶接などがある
    correct: B
  conclusion: 鋼材同士をつなぐ接合には、リベット接合・ボルト接合・高力ボルト接合・溶接接合などがある。
  reason: 鉄骨構造は部材を組み立てる構造で、部材同士を接合する必要があるため。
  conditions:
  - 鉄骨部材同士を接合する場合
  source:
    pages:
    - 176
    - 179
    - 183
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-STEEL-DUCTILITY-PREVENTS-BRITTLE-FRACTURE
  order: 6
  type: principle
  principle: 鋼材の靭性と破断
  question:
    prompt: 教材が説明する一般的な鋼材の靭性と破断について、正しい結論はどちらか。
    choices:
      A: 急激に破断しやすく、脆性破壊しやすい
      B: 急激に破断しにくく、脆性破壊しにくい
    correct: B
  conclusion: 鋼材は急激に破断しにくく、脆性破壊しにくい。
  reason: 鋼材は伸びる材料で、靭性に富むため。
  conditions:
  - 教材が説明する一般的な鋼材の材料特性
  source:
    pages:
    - 176
    - 177
    - 181
    question_codes: []
  prerequisites: []
