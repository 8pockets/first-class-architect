      url: https://www.pref.osaka.lg.jp/documents/35034/05_a41kakusyukouzounosekkei_1.pdf
      supports:
      - statement
      - explanation
      - conditions
    - kind: professional_body
      title: 建築鉄骨構造技術支援協会 鉄骨Q&A 3-3
      locator: 通しダイアフラムと梁フランジの食違い防止方法／上下位置・鋼材精度・肩折れ
      url: https://sasst.jp/qa/q3/q3-3.html
