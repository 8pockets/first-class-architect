- id: S-K6-INTERNAL-DIAPHRAGM-CONSTRUCTION
  order: 2
  type: identification
  display_content:
    definition: 内ダイアフラムは柱内部の梁上下フランジ位置へ設ける。教材の既成角形鋼管を使う製作例では、柱を切断して内部へ取り付けた後、柱を再接合する。全ての箱形柱の製作法をこの手順に限定しない。
    distinguishing_conditions:
    - 教材の既成角形鋼管柱を用いた製作例
    - 内ダイアフラムを柱内部の梁上下フランジ位置に設ける
    confusable_points:
    - 内ダイアフラムの配置位置と、鋼板から組み立てる箱形柱などの別の製作手順を区別する。
  principle: 内ダイアフラム形式の製作手順
  question:
    prompt: 教材の既成角形鋼管柱に内ダイアフラムを設ける製作例で、柱を切断する目的として正しい結論はどちらか。
    choices:
      A: 柱内部へダイアフラムを溶接するため
      B: ダイアフラムを柱の外側へ突出させるため
    correct: A
  conclusion: 内ダイアフラムは柱内部の梁上下フランジ位置へ設ける。教材の既成角形鋼管を使う製作例では、柱を切断して内部へ取り付けた後、柱を再接合する。全ての箱形柱の製作法をこの手順に限定しない。
  reason: 柱内部へダイアフラムを取り付ける必要があるため。
  conditions:
  - 教材の既成角形鋼管柱を用いた製作例
  - 内ダイアフラムを柱内部の梁上下フランジ位置に設ける
  source:
    pages:
    - 209
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-THROUGH-DIAPHRAGM-CONSTRUCTION-AND-WELD
  order: 3
  type: identification
  principle: 通しダイアフラム形式の柱切断位置と溶接
  conclusion: 通しダイアフラム形式は柱を梁の上下フランジ位置で切断し、上下柱とダイアフラムを完全溶込み溶接する。
  reason: 教材に記載なし
  conditions:
  - 角形鋼管柱の通しダイアフラム形式
  source:
    pages:
    - 209
    question_codes: []
  prerequisites:
  - S-K6-FULL-PENETRATION-WELD-DEFINITION-REPEATED-STRESS
  editorial_status: source_checked
  question:
    prompt: 通しダイアフラム形式で柱を切断する位置について、正しい結論はどちらか。
    choices:
      A: 梁ウェブ中央位置で柱を切断する
      B: 梁フランジ位置で柱を切断する
    correct: B
  display_content:
    definition: 通しダイアフラム形式は柱を梁の上下フランジ位置で切断し、上下柱とダイアフラムを完全溶込み溶接する。
    distinguishing_conditions:
    - 角形鋼管柱の通しダイアフラム形式
    confusable_points:
    - 本問では「梁ウェブ中央位置で柱を切断する」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
