principles:
- id: S-K6-THROUGH-DIAPHRAGM-THICKNESS-MISMATCH-PREVENTION
  order: 1
  type: principle
  principle: 通しダイアフラムの食い違い防止板厚
  question:
    prompt: 板厚25mmの通しダイアフラムに19mmの梁フランジを突合せ溶接する。フランジ上面が1mmはみ出し別途補強を行わない場合、正しい結論はどちらか。
    choices:
      A: 板厚差6mmがあるため位置をそのままとする
      B: フランジが板厚内部に納まるよう位置を是正する
    correct: B
  conclusion: 梁フランジは通しダイアフラムの板厚内部に納めて突合せ溶接する。板厚を梁フランジより1〜2サイズ大きくするだけでなく、実際の上下位置を確認する。
  reason: 鋼材許容誤差の累積や溶接変形があっても梁フランジをダイアフラム板厚内へ納め、補修困難な食い違いを防ぐため。
  conditions:
  - 通しダイアフラムと梁フランジの完全溶込み溶接
  - 一般的な鋼板寸法は3mm刻み
  - 設問は通しダイアフラム接合で、食い違いに対する別途補強を行わない場合
  source:
    pages:
    - 173
    - 209
    question_codes:
    - '01171'
    - '06162'
    - '25181'
    authoritative_sources:
    - kind: local_government
