    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 高力ボルト二面摩擦継手で部材寸法やボルトの張出しが納まりの制約となるときの検討案について、正しい結論はどちらか。
    choices:
      A: 一面摩擦や溶接併用を検討する
      B: 普通ボルトへ無条件で置き換える
    correct: A
  display_content:
