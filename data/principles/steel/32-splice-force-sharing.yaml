- id: S-K6-SPLICE-FRICTION-JOINT-SELECTION
  order: 1
  type: identification
  principle: 継手の高力ボルト摩擦接合形式の選択
  conclusion: 継手は高力ボルト二面摩擦接合が一般的で、部材が小さい場合やボルトの張出しが支障になる場合は、一面摩擦接合または高力ボルト・溶接併用を用いることがある。
  reason: 教材に記載なし
  conditions:
  - 鉄骨部材の現場継手
  - 部材寸法とボルト張出しの制約を考慮
  source:
