- id: S-K6-STEEL-BEAM-DEFLECTION-LIMITS
  order: 5
  type: rule
  principle: 鉄骨梁のたわみ制限
  conclusion: 両端支持梁のたわみはスパンの1/300以下、片持ち梁はスパンの1/250以下とする。
  reason: 教材に記載なし
  conditions:
  - 両端支持梁はL/300以下
  - 片持ち梁はL/250以下
