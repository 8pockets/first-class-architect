- id: S-K6-STEEL-BEAM-DEFLECTION-CHECK-OMISSION
  order: 4
  type: rule
  principle: 梁たわみ検討の省略条件
  conclusion: 梁せいが有効長さの1/15を超える場合は、たわみの検討を省略できる。
  reason: 教材に記載なし
  conditions:
