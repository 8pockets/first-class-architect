- id: S-K6-MIXED-WELD-ORDINARY-BOLT-LOAD-SHARING
  order: 3
  type: rule
  principle: 溶接と普通ボルトを混用する場合の応力負担
  conclusion: 溶接と普通ボルトを混用する接合では、全応力を溶接が負担するものとする。
  reason: 教材に記載なし
  conditions:
  - 溶接接合と普通ボルト接合の混用
