version: 1
section:
  id: K6-16
  title: 併用接合
  order: 17
principles:
- id: S-K6-COMBINED-BOLT-WELD-CONSTRUCTION-ORDER
  order: 1
  type: principle
  principle: 高力ボルト・溶接併用継手の施工順序
  question: 高力ボルト摩擦接合と溶接を併用する継手で施工順序が耐力の加算に与える影響について、結論、その理由及び結論を左右する条件を説明しなさい。
  conclusion: 高力ボルトを溶接より先に施工した場合は両者の耐力を加算できるが、溶接を先にした場合は全応力を溶接に負担させ、耐力を加算しない。
  reason: 溶接を先に施工すると溶接熱によるひずみで後施工の高力ボルト締付けが不完全となり、高力ボルトが力を伝えられなくなるため。
  conditions:
  - 一つの継手内で高力ボルト摩擦接合と溶接を併用
  - 溶接と高力ボルト接合の混用
  - 施工順序を区別する
  source:
    pages:
    - 163
    - 191
    question_codes:
    - '05163'
    - '24164'
    - '27184'
    - '30173'
  prerequisites:
  - S-K6-FRICTION-JOINT-PRE-SLIP-FORCE-TRANSFER
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  - S-K6-WELD-HEAT-DISTORTION
  editorial_status: source_checked
- id: S-K6-MIXED-BUTT-FILLET-WELD-LOAD-SHARING
  order: 2
  type: rule
  principle: 突合せ溶接とすみ肉溶接の応力分担
  conclusion: 突合せ溶接とすみ肉溶接を混用する場合は、それぞれの許容耐力に応じて応力を分担する。
  reason: 教材に記載なし
  conditions:
  - 突合せ溶接とすみ肉溶接を同じ接合部で併用する場合
  source:
    pages:
