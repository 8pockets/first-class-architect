version: 1
section:
  id: K6-16
  title: 併用接合
  order: 17
principles:
- id: S-K6-COMBINED-BOLT-WELD-CONSTRUCTION-ORDER
  order: 1
  type: principle
  principle: 高力ボルト・溶接併用継手の施工順序
  question:
    prompt: 一つの継手で高力ボルト摩擦接合を溶接より先に施工した場合、耐力の扱いとして正しい結論はどちらか。
    choices:
      A: 高力ボルトと溶接の耐力を加算できる
      B: 高力ボルトと溶接の耐力を加算しない
    correct: A
  conclusion: 高力ボルトを溶接より先に施工した場合は両者の耐力を加算できるが、溶接を先にした場合は全応力を溶接に負担させ、耐力を加算しない。
  reason: 溶接を先に施工すると溶接熱によるひずみで後施工の高力ボルト締付けが不完全となり、高力ボルトが力を伝えられなくなるため。
  conditions:
  - 一つの継手内で高力ボルト摩擦接合と溶接を併用
  - 溶接と高力ボルト接合の混用
  - 施工順序を区別する
  source:
    pages:
    - 163
    - 191
    question_codes:
    - '05163'
    - '24164'
    - '27184'
    - '30173'
  prerequisites:
  - S-K6-FRICTION-JOINT-PRE-SLIP-FORCE-TRANSFER
  - S-K6-STEEL-CONNECTION-TYPE-IDENTIFICATION
  - S-K6-WELD-HEAT-DISTORTION
  editorial_status: source_checked
- id: S-K6-MIXED-BUTT-FILLET-WELD-LOAD-SHARING
  order: 2
  type: rule
  principle: 突合せ溶接とすみ肉溶接の応力分担
  conclusion: 突合せ溶接とすみ肉溶接を混用する場合は、それぞれの許容耐力に応じて応力を分担する。
  reason: 教材に記載なし
  conditions:
  - 突合せ溶接とすみ肉溶接を同じ接合部で併用する場合
  source:
    pages:
    - 191
    question_codes: []
  prerequisites:
  - S-K6-WELD-ALLOWABLE-STRESS-FULL-PENETRATION
  - S-K6-WELD-ALLOWABLE-STRESS-NONFULL-PENETRATION
  editorial_status: source_checked
  question:
    prompt: 突合せ溶接とすみ肉溶接を混用する場合の応力分担について、正しい結論はどちらか。
    choices:
      A: 各溶接の許容耐力に応じて分担
      B: 突合せ溶接側へ全応力を集中
    correct: A
  display_content:
    rule: 突合せ溶接とすみ肉溶接を混用する場合は、それぞれの許容耐力に応じて応力を分担する。
    applicability:
    - 突合せ溶接とすみ肉溶接を同じ接合部で併用する場合
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-MIXED-WELD-ORDINARY-BOLT-LOAD-SHARING
  order: 3
  type: rule
  principle: 溶接と普通ボルトを混用する場合の応力負担
  conclusion: 溶接と普通ボルトを混用する接合では、全応力を溶接が負担するものとする。
  reason: 教材に記載なし
  conditions:
  - 溶接接合と普通ボルト接合の混用
  source:
    pages:
    - 191
    question_codes:
    - '05163'
  prerequisites:
  - S-K6-ORDINARY-BOLT-SHEAR-TRANSFER
  - S-K6-WELD-TYPE-IDENTIFICATION
  editorial_status: source_checked
  question:
    prompt: 普通ボルト継手と溶接を混用して60kNを伝える新設接合部で、許容耐力の計画について、正しい結論はどちらか。
    choices:
      A: 溶接だけで60kNを負担できるようにする
      B: 普通ボルト30kNと溶接30kNに分担する
    correct: A
  display_content:
    rule: 溶接と普通ボルトを混用する接合では、全応力を溶接が負担するものとする。
    applicability:
    - 溶接接合と普通ボルト接合の混用
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
