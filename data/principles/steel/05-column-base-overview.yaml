  editorial_status: source_checked
- id: S-K6-EXPOSED-BASE-SHEAR-CAPACITY-NOT-ADDITIVE
  order: 6
  type: rule
  principle: 露出柱脚のせん断耐力
  conclusion: 露出柱脚のせん断耐力は、ベースプレート下面の摩擦耐力とアンカーボルトせん断耐力のうち大きい方とし、両者を加算しない。
  reason: 教材に記載なし
  conditions:
  - 露出柱脚
  - 最大又は降伏せん断耐力の評価
  - 露出柱脚部のせん断力を算定する場合
  - 露出形式柱脚のせん断耐力算定
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - '02263'
    - '07263'
    - '18184'
  prerequisites:
