- id: S-K6-EXPOSED-BASE-MODEL-BY-DESIGN-TARGET
  order: 9
  type: principle
  principle: 露出柱脚の解析モデルと設計対象
  question:
    prompt: アンカーボルト本数が少ない露出柱脚で、柱・梁断面を安全側に設計する解析モデルについて、正しい結論はどちらか。
    choices:
      A: 柱脚をピンとして解析する
      B: 柱脚の回転剛性を考慮して解析する
    correct: A
  conclusion: アンカーボルト本数が少ない露出柱脚はほぼピンだが完全なピンではない。柱・梁断面設計では安全側に柱脚をピンとして解析し、アンカーボルト・ベースプレートなど柱脚部の設計では回転剛性と柱脚曲げモーメントを考慮する。
  reason: アンカーボルトの剛性により柱脚へ多少の曲げが生じ、柱梁設計と柱脚部設計で安全側となるモデルが異なるため。
  conditions:
  - アンカーボルト本数が少ない露出柱脚
  - 柱・梁の断面設計か柱脚部設計かを区別
  - 露出形式柱脚
  - 上部骨組を柱脚ピンとする場合でも柱脚部は別途評価
  - 露出柱脚
  source:
    pages:
    - 173
    - 180
    - 210
    question_codes:
    - '03171'
    - '19162'
    - '27154'
  prerequisites: []
  editorial_status: source_checked
