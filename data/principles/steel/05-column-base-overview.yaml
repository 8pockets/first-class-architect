  type: rule
  principle: 露出柱脚アンカーボルト孔径
  conclusion: アンカーボルト孔径は、公称軸径に5mm以下を加えた大きさとする。
  reason: 教材に記載なし
  conditions:
  - 通常の露出柱脚のベースプレートのアンカーボルト孔
  - 公称軸径に対する孔径の上限
  source:
