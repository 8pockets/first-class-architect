  editorial_status: source_checked
- id: S-K6-EMBEDDED-BASE-EFFECTIVE-FIXED-POINT
  order: 8
  type: rule
  principle: 埋込み柱脚の構造計算上の固定位置
  conclusion: 埋込み柱脚は、ベースプレート位置ではなく、基礎コンクリートまたは地中梁上端から柱幅の1.5倍下がった位置を固定点として計算する。
  reason: 教材に記載なし
  conditions:
  - 埋込み形式柱脚の応力解析
  - 埋込み形式柱脚
  - 特別な剛性検討を行わない場合
  - 埋込み柱脚を構造計算でモデル化する場合
  source:
    pages:
    - 172
    - 180
    - 204
    question_codes:
    - '19161'
    - '29164'
  prerequisites:
  - S-K6-EMBEDDED-BASE-MINIMUM-DEPTH
  editorial_status: source_gap
- id: S-K6-EXPOSED-BASE-MODEL-BY-DESIGN-TARGET
  order: 9
  type: principle
  principle: 露出柱脚の解析モデルと設計対象
  question: アンカーボルト本数が少ない露出柱脚の解析モデルを設計対象に応じてどのように扱うか、結論、その理由及び結論を左右する条件を説明しなさい。
  conclusion: アンカーボルト本数が少ない露出柱脚はほぼピンだが完全なピンではない。柱・梁断面設計では安全側に柱脚をピンとして解析し、アンカーボルト・ベースプレートなど柱脚部の設計では回転剛性と柱脚曲げモーメントを考慮する。
  reason: アンカーボルトの剛性により柱脚へ多少の曲げが生じ、柱梁設計と柱脚部設計で安全側となるモデルが異なるため。
  conditions:
  - アンカーボルト本数が少ない露出柱脚
  - 柱・梁の断面設計か柱脚部設計かを区別
  - 露出形式柱脚
  - 上部骨組を柱脚ピンとする場合でも柱脚部は別途評価
  - 露出柱脚
  source:
    pages:
    - 173
    - 180
    - 210
    question_codes:
    - '03171'
    - '19162'
    - '27154'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-EXPOSED-BASE-ANCHOR-LOCKING
  order: 10
  type: rule
  principle: 露出柱脚アンカーボルトの座金と戻り止め
  conclusion: アンカーボルトには座金を用い、ナットは二重使用または同等以上の効力を持つ戻り止めを行う。
  reason: 教材に記載なし
  conditions:
  - 露出形式柱脚
  - 露出柱脚
  source:
