  editorial_status: source_checked
  question:
    prompt: 通常の露出柱脚で公称軸径24mmのアンカーボルトを用いるとき、教材の孔径上限について、正しい結論はどちらか。
    choices:
      A: 26mm
      B: 29mm
    correct: B
  display_content:
    rule: アンカーボルト孔径は、公称軸径に5mm以下を加えた大きさとする。
    applicability:
