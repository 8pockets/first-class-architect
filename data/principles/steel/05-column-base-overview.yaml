- id: S-K6-EXPOSED-BASE-PLATE-MINIMUM-THICKNESS
  order: 5
  type: rule
  display_content:
    rule: ベースプレート厚さはアンカーボルト径の1.3倍以上とする。
    applicability:
    - 教材で示す通常の露出柱脚の仕様
    - アンカーボルト径の1.3倍という厚さの条件を適用する場合
    numbers_exceptions:
    - ベースプレート厚さはアンカーボルト径の1.3倍以上とする。
  principle: 露出柱脚ベースプレートの厚さ
  question:
    prompt: 教材の露出柱脚の仕様を適用し、アンカーボルト径を24mmとする。ベースプレート厚さの下限として正しい結論はどちらか。
    choices:
      A: 31.2mm以上とする
      B: 28.8mm以上とする
    correct: A
  conclusion: ベースプレート厚さはアンカーボルト径の1.3倍以上とする。
  reason: ベースプレートの変形を抑えるため。
  conditions:
  - 教材で示す通常の露出柱脚の仕様
  - アンカーボルト径の1.3倍という厚さの条件を適用する場合
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - 施工30141
    - '28163'
  prerequisites:
