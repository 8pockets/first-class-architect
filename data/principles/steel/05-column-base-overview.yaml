- id: S-K6-EXPOSED-BASE-ANCHOR-EMBEDMENT-LENGTH
  order: 3
  type: rule
  principle: 露出柱脚アンカーボルトの定着長さ
  question: 露出柱脚アンカーボルトの定着長さと先端の処置について、結論、その理由及び結論を左右する条件を述べなさい。
  conclusion: 所定の構造計算を行わない場合、定着長さはアンカーボルト径の20倍以上とし、先端をかぎ状に折り曲げるか定着金物を設ける。
  reason: 抜け出しとコンクリート破壊を防ぐため。
  conditions:
  - 露出形式柱脚
  - 付着力を考慮した安全確認を別途行わない場合
  - 露出柱脚
  - 露出形式柱脚のアンカーボルト
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - '23161'
    - '23162'
    - '28163'
  prerequisites:
  - S-K6-EXPOSED-BASE-MODEL-BY-DESIGN-TARGET
  editorial_status: source_checked
- id: S-K6-EXPOSED-BASE-ANCHOR-HOLE-CLEARANCE
  order: 4
  type: rule
  principle: 露出柱脚アンカーボルト孔径
  conclusion: アンカーボルト孔径は、公称軸径に5mm以下を加えた大きさとする。
  reason: 教材に記載なし
  conditions:
  - 露出形式柱脚
  - 露出柱脚
  - 露出形式柱脚のベースプレート孔
  source:
