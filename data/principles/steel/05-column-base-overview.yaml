  editorial_status: source_gap
- id: S-K6-EXPOSED-BASE-PLATE-MINIMUM-THICKNESS
  order: 5
  type: rule
  principle: 露出柱脚ベースプレートの厚さ
  question: 露出柱脚のベースプレートに必要な厚さについて、結論、その理由及び結論を左右する条件を述べなさい。
  conclusion: ベースプレート厚さはアンカーボルト径の1.3倍以上とする。
  reason: ベースプレートの変形を抑えるため。
  conditions:
  - 露出形式柱脚
  - 露出柱脚
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - 施工30141
    - '28163'
  prerequisites:
