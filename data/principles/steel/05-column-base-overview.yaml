- id: S-K6-EMBEDDED-BASE-MINIMUM-DEPTH
  order: 1
  type: rule
  principle: 埋込み柱脚の埋込み深さ
  conclusion: 所定の構造計算を行わない場合、鉄骨柱の埋込み深さを柱の大きい見付け幅の2倍以上とする。
  reason: 教材に記載なし
  conditions:
  - 埋込み形式柱脚
  - 所定の構造計算を行わない場合
  - 埋込み柱脚
