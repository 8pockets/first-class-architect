- id: S-K6-EMBEDDED-BASE-EFFECTIVE-FIXED-POINT
  order: 8
  type: rule
  principle: 埋込み柱脚の構造計算上の固定位置
  conclusion: 埋込み柱脚は、ベースプレート位置ではなく、基礎コンクリートまたは地中梁上端から柱幅の1.5倍下がった位置を固定点として計算する。
  reason: 教材に記載なし
  conditions:
  - 埋込み形式柱脚の応力解析
  - 特別な剛性検討を行わない教材の標準的モデル
  source:
    pages:
    - 172
    - 180
    - 204
    question_codes:
    - '19161'
    - '29164'
  prerequisites:
  - S-K6-EMBEDDED-BASE-MINIMUM-DEPTH
  editorial_status: source_checked
  question:
    prompt: 柱幅400mmの埋込み柱脚を教材の標準的モデルで計算するとき、固定位置について、正しい結論はどちらか。
    choices:
      A: 基礎上端から800mm下
      B: 基礎上端から600mm下
    correct: B
  display_content:
    rule: 埋込み柱脚は、ベースプレート位置ではなく、基礎コンクリートまたは地中梁上端から柱幅の1.5倍下がった位置を固定点として計算する。
    applicability:
    - 埋込み形式柱脚の応力解析
