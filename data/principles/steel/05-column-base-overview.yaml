- id: S-K6-EXPOSED-BASE-ANCHOR-EMBEDMENT-LENGTH
  order: 3
  type: rule
  display_content:
    rule: 所定の構造計算を行わない場合、定着長さはアンカーボルト径の20倍以上とし、先端をかぎ状に折り曲げるか定着金物を設ける。
    applicability:
    - 露出形式柱脚
    - 付着力を考慮した安全確認を別途行わない場合
    - 露出柱脚
    - 露出形式柱脚のアンカーボルト
    numbers_exceptions:
    - 所定の構造計算を行わない場合、定着長さはアンカーボルト径の20倍以上とし、先端をかぎ状に折り曲げるか定着金物を設ける。
  principle: 露出柱脚アンカーボルトの定着長さ
  question:
    prompt: 付着力を考慮した安全確認を別途行わない露出柱脚で、アンカーボルトの定着長さについて、正しい結論はどちらか。
    choices:
      A: ボルト径の20倍以上とする
      B: ボルト径の20倍未満とする
    correct: A
  conclusion: 所定の構造計算を行わない場合、定着長さはアンカーボルト径の20倍以上とし、先端をかぎ状に折り曲げるか定着金物を設ける。
  reason: 抜け出しとコンクリート破壊を防ぐため。
  conditions:
  - 露出形式柱脚
  - 付着力を考慮した安全確認を別途行わない場合
  - 露出柱脚
  - 露出形式柱脚のアンカーボルト
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - '23161'
    - '23162'
    - '28163'
  prerequisites:
  - S-K6-EXPOSED-BASE-MODEL-BY-DESIGN-TARGET
  editorial_status: source_checked
