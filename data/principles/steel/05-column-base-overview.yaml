  editorial_status: source_gap
- id: S-K6-EXPOSED-BASE-ANCHOR-AREA-RATIO
  order: 2
  type: rule
  principle: 露出柱脚アンカーボルトの全断面積
  conclusion: 所定の構造計算を行わない場合、アンカーボルト全断面積を柱最下端断面積の20%以上とする。
  reason: 教材に記載なし
  conditions:
  - 露出形式柱脚
  - 所定の構造計算を行わない場合
  - 露出柱脚
