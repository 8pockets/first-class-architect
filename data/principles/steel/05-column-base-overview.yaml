    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-EXPOSED-BASE-SHEAR-CAPACITY-NOT-ADDITIVE
  order: 6
  type: rule
  principle: 露出柱脚のせん断耐力
  conclusion: 露出柱脚のせん断耐力は、ベースプレート下面の摩擦耐力とアンカーボルトせん断耐力のうち大きい方とし、両者を加算しない。
  reason: 教材に記載なし
  conditions:
  - 通常の露出柱脚の最大又は降伏せん断耐力
  - 摩擦耐力とアンカーボルトせん断耐力の同時加算を見込まない評価
  source:
    pages:
    - 171
    - 180
    - 204
    question_codes:
    - '02263'
    - '07263'
    - '18184'
  prerequisites:
  - S-K6-EXPOSED-BASE-MODEL-BY-DESIGN-TARGET
  editorial_status: source_checked
  question:
    prompt: 露出柱脚で下面摩擦耐力80kN、アンカーボルトせん断耐力50kNと評価した場合、教材のせん断耐力の扱いについて、正しい結論はどちらか。
    choices:
      A: 80kNを採用する
      B: 130kNを採用する
    correct: A
  display_content:
    rule: 露出柱脚のせん断耐力は、ベースプレート下面の摩擦耐力とアンカーボルトせん断耐力のうち大きい方とし、両者を加算しない。
    applicability:
    - 通常の露出柱脚の最大又は降伏せん断耐力
    - 摩擦耐力とアンカーボルトせん断耐力の同時加算を見込まない評価
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-WRAPPED-BASE-HEIGHT-AND-TOP-CONFINEMENT
  order: 7
  type: rule
  display_content:
    rule: 根巻き高さは柱の大きい見付け幅の2.5倍以上とし、上端部の帯筋を密に配置する。
    applicability:
    - 教材で示す根巻き柱脚の仕様
    - 根巻き高さを大きい見付け幅の2.5倍以上とする条件を適用
    numbers_exceptions:
    - 根巻き高さは柱の大きい見付け幅の2.5倍以上とし、上端部の帯筋を密に配置する。
  principle: 根巻き柱脚の高さと上端拘束
  question:
    prompt: 教材の根巻き柱脚の高さの仕様を適用し、柱の大きい見付け幅を400mmとする。根巻き高さの下限として正しい結論はどちらか。
    choices:
      A: 800mm以上とする
      B: 1000mm以上とする
    correct: B
  conclusion: 根巻き高さは柱の大きい見付け幅の2.5倍以上とし、上端部の帯筋を密に配置する。
  reason: 根巻き部のせん断降伏を防いで曲げ降伏を先行させ、上端へ集中する力に対してコンクリートを拘束するため。
  conditions:
  - 教材で示す根巻き柱脚の仕様
  - 根巻き高さを大きい見付け幅の2.5倍以上とする条件を適用
