version: 1
section:
  id: K6-31
  title: 工場継手・現場継手
  order: 32
principles:
- id: S-K6-COLUMN-SPLICE-NEAR-MIDSTORY
  order: 1
  type: principle
  principle: 柱・梁の継手位置と作用力
  question:
    prompt: 鉄骨柱・梁の中間継手位置を定めるとき、部材に生じる力との関係として正しい結論はどちらか。
    choices:
      A: 部材に生じる力が小さい位置へ設ける
      B: 部材に生じる力が大きい位置へ設ける
    correct: A
  conclusion: 柱・梁の継手は部材に生じる力が小さい位置へ設ける。柱継手は曲げ応力が小さい階高中央付近が望ましく、床面から約1mの位置も許容範囲となり得る。
  reason: 継手に作用する応力を小さくしつつ、現場施工性も確保するため。
  conditions:
  - 鉄骨柱の現場継手
  - 柱・梁の中間継手位置を決める場合
  source:
    pages:
    - 172
    - 206
    question_codes:
    - '05153'
    - '19152'
    - '26261'
    - '29183'
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-JOINT-SPLICE-LOCATION-FABRICATION
  order: 2
  type: identification
  display_content:
    definition: 柱梁接合部に設ける仕口は一般に工場で製作し、柱・梁の中間に設ける継手は一般に現場で施工する。
    distinguishing_conditions:
    - 鉄骨柱梁の仕口と柱・梁中間継手を区別
    confusable_points:
    - 「一般に現場で製作する」とは区別する。
  principle: 仕口・継手の位置と製作場所
  question:
    prompt: 鉄骨の柱梁接合部に設ける仕口について、一般的な製作場所として正しい結論はどちらか。
    choices:
      A: 一般に現場で製作する
      B: 一般に工場で製作する
    correct: B
  conclusion: 柱梁接合部に設ける仕口は一般に工場で製作し、柱・梁の中間に設ける継手は一般に現場で施工する。
  reason: 柱梁接合部は工場で品質を管理して製作し、運搬できる部材単位を現場の継手で接続するため。
  conditions:
  - 鉄骨柱梁の仕口と柱・梁中間継手を区別
  source:
    pages:
    - 206
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
