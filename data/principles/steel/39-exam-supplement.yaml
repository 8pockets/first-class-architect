- id: S-K6-EXAM-SN-YIELD-RANGE
  order: 3
  type: principle
  principle: SN材の降伏点の規定
  question:
    prompt: 板厚12mm以上40mm以下のSN490B鋼板の降伏点又は耐力について、正しい結論はどちらか。
    choices:
      A: 下限値だけが規定される
      B: 下限値と上限値が規定される
    correct: B
  conclusion: SN490B鋼板の板厚12mm以上40mm以下では、降伏点又は耐力に下限・上限がある。設計で想定した降伏メカニズムの実現に関係する。 SN材B種・C種では、適用板厚等の条件の下で降伏比や降伏点レンジを管理し、想定した降伏順序の実現確度を高める。12mm以上40mm以下の鋼板の例に対し、板厚40mm超100mm以下のSN490B鋼板では降伏点の下限295N/mm²・上限415N/mm²を用いる。
  reason: 降伏点のばらつきを制限することにより、設計で想定した順序で部材を降伏させやすくするため。
  conditions:
  - 板厚12mm以上40mm以下のSN490B鋼板
  - 引張強さの規定と降伏点の規定を区別する
  source:
