- id: S-K6-EXAM-SN-THICKNESS-F
  order: 7
  type: rule
  principle: SN材の板厚と許容値
  question:
    prompt: SN490Bで板厚25mmと50mmの部材の許容引張応力度を比較するとき、正しい結論はどちらか。
    choices:
      A: 二つの部材は同じである
      B: 50mmの部材の方が小さい
    correct: B
