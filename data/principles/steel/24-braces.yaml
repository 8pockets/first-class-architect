- id: S-K6-BRACE-BALANCED-DIRECTIONAL-LAYOUT
  order: 2
  type: rule
  principle: ブレースの方向別配置
  conclusion: ブレースは、すべての方向に釣り合いよく配置する。
  reason: 教材に記載なし
  conditions:
  - 建物のブレース配置計画
  source:
    pages:
    - 199
    question_codes:
    - 06182
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 同じ総耐力のブレースを建物の片側だけへ集中させる案と、平面的に釣り合わせる案の配置方針について、正しい結論はどちらか。
    choices:
      A: 平面的に釣り合わせて配置する
      B: 総耐力が同じなら片側へ集中させる
    correct: A
  display_content:
    rule: ブレースは、すべての方向に釣り合いよく配置する。
    applicability:
    - 建物のブレース配置計画
    numbers_exceptions: []
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
- id: S-K6-BRACE-HORIZONTAL-LOAD-AXIAL-FORCE
  order: 3
  type: principle
  principle: ブレースによる水平力から軸力への変換
  question:
    prompt: ブレースが風圧力・地震力などの水平力へ抵抗する仕組みとして、正しい結論はどちらか。
    choices:
      A: 斜材の引張・圧縮の軸力へ変換して負担する。
      B: 斜材の曲げモーメントだけで負担する。
    correct: A
  conclusion: ブレースは風圧力・地震力などの水平力を引張・圧縮の軸力へ変えて柱・梁の応力を低減する。
  reason: 斜材が水平力の成分を材軸方向力として負担するため。
  conditions:
  - 鉄骨造へ斜材を設けて水平力へ抵抗する場合
  source:
    pages:
    - 199
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-VERTICAL-HORIZONTAL-BRACE-ROLES
  order: 103
  type: identification
  display_content:
    definition: 鉛直ブレースは壁面の水平変形を抑え、水平ブレースは水平面の剛性を高めて水平面の変形を抑える。
    distinguishing_conditions:
    - 鉄骨造の鉛直面または水平面へ斜材を設ける場合
    - 鉛直ブレースと水平ブレースを区別する場合
    confusable_points:
    - 「水平面の変形を抑える」とは区別する。
  principle: 鉛直ブレースと水平ブレースの配置面別役割
  question:
    prompt: 鉄骨造の鉛直面に設ける鉛直ブレースについて、主に抑える変形として正しい結論はどちらか。
    choices:
      A: 壁面の水平変形を抑える。
      B: 水平面の変形を抑える。
    correct: A
  conclusion: 鉛直ブレースは壁面の水平変形を抑え、水平ブレースは水平面の剛性を高めて水平面の変形を抑える。
  reason: 鉛直面または水平面へ配置した斜材が、その配置面の剛性を高めるため。
  conditions:
  - 鉄骨造の鉛直面または水平面へ斜材を設ける場合
  - 鉛直ブレースと水平ブレースを区別する場合
  source:
    pages:
    - 199
    question_codes: []
  prerequisites:
  - S-K6-BRACE-HORIZONTAL-LOAD-AXIAL-FORCE
  editorial_status: source_checked
- id: S-K6-BRACE-SECTION-USE-IDENTIFICATION
  order: 4
  type: identification
  principle: 建物規模に応じたブレース鋼材の例
  conclusion: 教材図では、軽微な建築物に鉄筋バー、一般的な建築物に鋼管・山形鋼、高層・超高層建築物にH形鋼を用いる例を示している。
  reason: 教材に記載なし
  conditions:
  - 教材図による代表的な使用例であり、絶対的な適用規定ではない
  source:
    pages:
    - 199
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
  question:
    prompt: 圧縮側にも抵抗を期待する高層建築の筋かいとして教材が示す断面例について、正しい結論はどちらか。
    choices:
      A: 細い鉄筋バー
      B: H形鋼
    correct: B
  display_content:
    definition: 教材図では、軽微な建築物に鉄筋バー、一般的な建築物に鋼管・山形鋼、高層・超高層建築物にH形鋼を用いる例を示している。
    distinguishing_conditions:
    - 教材図による代表的な使用例であり、絶対的な適用規定ではない
    confusable_points:
    - 本問では「細い鉄筋バー」と区別する。
  verification:
    statement_source: verified
    explanation_completeness: complete
    conditions_completeness: complete
