- id: S-K6-BRACE-BALANCED-DIRECTIONAL-LAYOUT
  order: 2
  type: rule
  principle: ブレースの方向別配置
  conclusion: ブレースは、すべての方向に釣り合いよく配置する。
  reason: 教材に記載なし
  conditions:
