principles:
- id: S-K6-BRACE-CAPACITY-DESIGN-JOINT-OVERSTRENGTH
  order: 1
  type: rule
  principle: 筋かい端部・接合部の保有耐力接合
  question:
    prompt: 炭素鋼の耐震ブレース端部・接合部を保有耐力接合とするとき、破断耐力と実断面の軸部降伏耐力との関係として正しい結論はどちらか。
    choices:
      A: 破断耐力を軸部降伏耐力の1.2倍未満とする
      B: 破断耐力を軸部降伏耐力の1.2倍以上とする
    correct: B
  conclusion: 筋かい端部・接合部の破断耐力を、使用する筋かい断面の軸部降伏耐力より十分大きくし、炭素鋼では1.2倍以上、ステンレス鋼では1.5倍以上とする。
  reason: ブレース軸部の降伏による塑性変形より先に脆性的な接合破断を生じさせないため。
  conditions:
  - 軸力を負担する筋かい
  - 採用断面が必要断面より大きい場合も実断面で降伏耐力を算定
  - 耐震ブレースの接合部・端部
  source:
    pages:
    - 169
    - 199
    question_codes:
