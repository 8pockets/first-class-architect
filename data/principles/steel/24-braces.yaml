principles:
- id: S-K6-BRACE-CAPACITY-DESIGN-JOINT-OVERSTRENGTH
  order: 1
  type: rule
  principle: 筋かい端部・接合部の保有耐力接合
  question: 筋かい端部・接合部を保有耐力接合とする際の破断耐力の扱いを述べ、その理由と、鋼種・採用断面など結論を左右する条件を説明しなさい。
  conclusion: 筋かい端部・接合部の破断耐力を、使用する筋かい断面の軸部降伏耐力より十分大きくし、炭素鋼では1.2倍以上、ステンレス鋼では1.5倍以上とする。
  reason: ブレース軸部の降伏による塑性変形より先に脆性的な接合破断を生じさせないため。
  conditions:
  - 軸力を負担する筋かい
  - 採用断面が必要断面より大きい場合も実断面で降伏耐力を算定
  - 耐震ブレースの接合部・端部
  source:
