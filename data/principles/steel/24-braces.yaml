  title: ブレース
  order: 25
principles:
- id: S-K6-BRACE-CAPACITY-DESIGN-JOINT-OVERSTRENGTH
  order: 1
  type: rule
  display_content:
    rule: 筋かい端部・接合部の破断耐力を、使用する筋かい断面の軸部降伏耐力より十分大きくし、炭素鋼では1.2倍以上、ステンレス鋼では1.5倍以上とする。
    applicability:
    - 軸力を負担する筋かい
    - 採用断面が必要断面より大きい場合も実断面で降伏耐力を算定
    - 耐震ブレースの接合部・端部
    numbers_exceptions:
    - 筋かい端部・接合部の破断耐力を、使用する筋かい断面の軸部降伏耐力より十分大きくし、炭素鋼では1.2倍以上、ステンレス鋼では1.5倍以上とする。
  principle: 筋かい端部・接合部の保有耐力接合
  question:
    prompt: 炭素鋼ブレースの実断面の軸部降伏耐力が100kNである。教材の保有耐力接合条件による端部・接合部の破断耐力の下限として、正しい結論はどちらか。
    choices:
      A: 100kN以上とする
      B: 120kN以上とする
    correct: B
  conclusion: 筋かい端部・接合部の破断耐力を、使用する筋かい断面の軸部降伏耐力より十分大きくし、炭素鋼では1.2倍以上、ステンレス鋼では1.5倍以上とする。
  reason: ブレース軸部の降伏による塑性変形より先に脆性的な接合破断を生じさせないため。
  conditions:
  - 軸力を負担する筋かい
  - 採用断面が必要断面より大きい場合も実断面で降伏耐力を算定
  - 耐震ブレースの接合部・端部
  source:
    pages:
