- id: S-K6-BRACE-HORIZONTAL-LOAD-TO-AXIAL-FORCE
  order: 3
  type: principle
  principle: ブレースの水平力伝達と鉛直・水平ブレースの役割
  question: 鉄骨造のブレースが水平力をどのように負担し、鉛直ブレースと水平ブレースが各面の変形へどう作用するかという結論を述べ、その理由と、適用される配置条件を説明しなさい。
  conclusion: ブレースは風圧力・地震力などの水平力を引張・圧縮の軸力へ変えて柱梁の応力を低減する。鉛直ブレースは壁面の水平変形、水平ブレースは水平面の変形を抑える。
  reason: 斜材が水平力を軸方向力として負担し、鉛直面または水平面の剛性を高めるため。
  conditions:
  - 鉄骨造の鉛直面または水平面へ斜材を設ける場合
  source:
    pages:
    - 199
    question_codes: []
  prerequisites: []
  editorial_status: source_checked
- id: S-K6-BRACE-SECTION-USE-IDENTIFICATION
  order: 4
  type: identification
  principle: 建物規模に応じたブレース鋼材の例
  conclusion: 教材図では、軽微な建築物に鉄筋バー、一般的な建築物に鋼管・山形鋼、高層・超高層建築物にH形鋼を用いる例を示している。
  reason: 教材に記載なし
  conditions:
  - 教材図による代表的な使用例であり、絶対的な適用規定ではない
  source:
