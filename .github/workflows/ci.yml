name: Validate principle catalog

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "principle_catalog/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Read previous print registry
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous_sha="${PREVIOUS_SHA:-HEAD^}"
          git show "${previous_sha}:data/principles/steel/manifest.yaml" > "${RUNNER_TEMP}/previous-manifest.yaml"
      - name: Preserve permanent print numbers
        run: uv run --locked python -m principle_catalog verify-print-registry --previous "${RUNNER_TEMP}/previous-manifest.yaml"
      - name: Read previous question editions
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous_sha="${PREVIOUS_SHA:-HEAD^}"
          previous_editions="${RUNNER_TEMP}/previous-question-editions.yaml"
          if git cat-file -e "${previous_sha}:data/principles/steel/question-editions.yaml" 2>/dev/null; then
            git show "${previous_sha}:data/principles/steel/question-editions.yaml" > "${previous_editions}"
          else
            cp data/principles/steel/question-editions.yaml "${previous_editions}"
          fi
      - name: Preserve issued question editions
        run: uv run --locked python -m principle_catalog verify-question-editions --previous "${RUNNER_TEMP}/previous-question-editions.yaml"
      - name: Read previous coverage tiers
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous_sha="${PREVIOUS_SHA:-HEAD^}"
          previous_coverage="${RUNNER_TEMP}/previous-coverage-tiers.yaml"
          if git cat-file -e "${previous_sha}:data/principles/steel/coverage-tiers.yaml" 2>/dev/null; then
            git show "${previous_sha}:data/principles/steel/coverage-tiers.yaml" > "${previous_coverage}"
          else
            cp data/principles/steel/coverage-tiers.yaml "${previous_coverage}"
          fi
      - name: Preserve coverage tier schemes
        run: uv run --locked python -m principle_catalog verify-coverage-tiers --previous "${RUNNER_TEMP}/previous-coverage-tiers.yaml"
      - name: Read previous identity history
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous_sha="${PREVIOUS_SHA:-HEAD^}"
          for filename in identities.yaml migration.yaml; do
            previous_file="${RUNNER_TEMP}/previous-${filename}"
            if git cat-file -e "${previous_sha}:data/principles/steel/${filename}" 2>/dev/null; then
              git show "${previous_sha}:data/principles/steel/${filename}" > "${previous_file}"
            else
              cp "data/principles/steel/${filename}" "${previous_file}"
            fi
          done
      - name: Preserve identity and migration history
        run: uv run --locked python -m principle_catalog verify-identity-history --previous-identities "${RUNNER_TEMP}/previous-identities.yaml" --previous-migration "${RUNNER_TEMP}/previous-migration.yaml"
      - name: Validate catalog
        run: uv run --locked python -m principle_catalog validate
      - name: Run tests
        run: uv run --locked python -m pytest
      - name: Check browser script syntax
        run: |
          node --check principle_catalog/static/catalog.js
          node --check principle_catalog/static/answer-history.js
          node --check principle_catalog/static/research.js
      - name: Test catalog interactions
        run: node --test tests/*.test.mjs
      - name: Build public site
        run: uv run --locked python -m principle_catalog build --output _site
